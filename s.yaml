## Appendix: Validation Comments on the Draft Form (following the meeting)

Validation reviewed the draft form after the meeting. The points below are returned as comments on the form for the Model Owner team to address before submission, and are recorded here for reference. Design questions that need discussion are listed under Items Deferred.

- Section 1, scope: the draft describes the request as covering the LLM component of the Entity Name Resolution as a Service (ENRaaS) framework. A Provisional Approval covers the model rather than a component of it, so the description should state that the request covers the new version of Model-7158 that incorporates an LLM. Scoped that way, the request also covers the retained vector database retrieval for the new pilot period.
- Section 1, design description: the form should state explicitly that the LLM augments the existing retrieval-and-ranking process rather than replacing it, as the meeting description and the data flow diagram indicate, and describe the transaction data the NAICS inference uses: which fields, the observation window, and how the data is aggregated before it reaches the LLM.
- Section 5, challenger design against the VectorDB plan: Section 5 has the LLM version running in parallel as a challenger to the StorProc_ENRaaS-VectorDB version for three months, to 01/31/2027, and then replacing "both the Stored Procs and ENRaaS VectorDB for ACH payment rail." Bill confirmed on 09/22/2026 that the VectorDB version is not in production use and will not be after 11/30/2026, so the form should state the stored procedures as the production champion during the pilot. A development-only VectorDB comparison arm, if retained, should be described as such; it supports the comparison evidence and needs no approval. The form should also state the date the VectorDB version was last in production use, so the December 2025 pilot can be closed out.
- Section 3, rail scope: the request is framed as testing the LLM against the stored procedures for the ACH rail only. Bill confirmed that the legacy stored procedures resolve Check, Wire, and Corporate Card today; the form should state this and whether it continues during and after the pilot.
- Sections 2 and 5, dates: Section 2 states production usage anticipated 02/01/2027 while Section 5 has deployment to production on 03/01/2027; the two should agree. The Section 5 milestones also allow two weeks between delivering documentation for full validation (02/15/2027) and production deployment (03/01/2027). A full validation cannot be completed in that time, so the deployment date should follow the validation timeline. At the front end, the PA review takes three to four weeks from a complete submission, and the 11/01/2026 first-use date in the draft should allow for that.
- Section 6, EMA reference: the FRBD pre-review disposition and EMA link carry over from December 2025 (EMA 60213900). The form should reference the change EMA for the LLM version once submitted, since MRG has confirmed that EMA is required before the transition.
- Housekeeping: the draft still contains Validation's review comments and question-and-answer exchanges from the review of the December 2025 PA request, including Kensho comparisons that no longer apply. These should be removed before submission; Validation has marked the prior comments as resolved. The dates and email addresses in the draft also need to be checked and corrected before submission; several are inconsistent or out of date.
- Performance testing results are not yet in the draft. The evidence expected is set out under Ground Truth and Evaluation Method above.
- GenAI-specific documentation, drawing on the Gen AI Supplemental Requirements, is not yet in the draft. The submission should cover:
  - confirmation that GPT-OSS-20B/v1 and Mistral-7B-Instruct-v0.3 are used as released, with no fine-tuning, and that neither model calls tools or external APIs;
  - the prompt instructions used for the NAICS inference and the name normalization pass, with representative examples of inputs and the corresponding outputs for each;
  - the reference data behind the vector and entity databases (sources, refresh cycle, record counts) and the transaction data aggregated for the NAICS inference;
  - the controls specific to the LLM components: how an incorrect or fabricated NAICS inference or name rewrite is contained before it affects the resolved entity, and how input data is protected (prompt injection through the name field, and handling of any personal information in the transaction summaries);
  - the changes anticipated during the pilot (prompts, model versions, thresholds) and how each will be classified under model change management, including the regression test suite discussed in the meeting.
- December 2025 pilot monitoring: the December 2025 PA required a manual review of 200 accepted records per payment rail per month as a condition of the approval while the VectorDB version was in use. Those reviews are SME-confirmed matches on VectorDB outputs and serve both as ground truth for the VectorDB arm of the comparison and as a labelled set to run through the LLM version. Validation expects the results for the period the VectorDB version was in production use to be included with the submission.

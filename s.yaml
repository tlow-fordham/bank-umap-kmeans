## Overall Performance

In 2026 I completed seven validation deliverables, all on time against the team's 90 percent target: three Provisional Approvals, three Special Purpose Validations and one Initial Validation. They included the Provisional Approval of the bank's first medium-risk agentic AI application in pilot production, which then passed internal audit with no issues or observations, and an Initial Validation completed in 34 days against a 42-day ceiling. I caught three model changes made or planned without approval and routed each to the right review, and my own analysis decided the outcomes: on Model-7306 the model owner's regrade was shown to come from moving answers out of the denominator and a code defect that bypassed the model's hallucination check was found and fixed; on Model-7468 the published metrics did not reconcile to their own data, and my review of all 172 selling points became the evidence. The automation work I co-lead became an enterprise program sponsored by Bob, and my Lumenova testing produced measurable platform improvements and a standing MRM role on the first line's evaluation platform. I also took on more people development, with Aditi moving into a primary validator role and two new offshore analysts mentored on live work.

The strengths I relied on most were independent challenge grounded in my own analysis, and the working relationships that let that challenge land: with model owners, with MRG on Model-7306, Model-7468 and Model-7158, with the AI CoE and AI Enablement through Jim Howard and Prashant, and with Bob on the automation program. I received positive feedback from Saima, who leads AI Enablement, on the guardrail template work, and from the model development teams on Model-7409 and Model-7306. I hold a position when the evidence supports it, as with registering our automation work with RM&C, and I take direction when it improves the work: I rebuilt the Model-7468 rationale on Xinyu's feedback so the restriction rested on the control gap, and I cut the Model-7409 Special Purpose Validation to the extension justification alone at her review, after which Bob approved it for sign-off the next day. My development area remains concise, executive-ready writing. I have made progress, and Bob's only comment on the MVP1 plan was its timeline; I am now applying the standard of matching a document's depth to its review pathway from the first draft. In 2027 I plan to deliver the agentic AI evaluation research and the training and workshop it feeds, drive the automation program's first release, complete the Model-7158 and Model-7637 Provisional Approvals and the Model-7409 Initial Validation by 06/09/2027, take Model-7889 CPP Merchant Identification through its first validation once the EMA is accepted, and bring Aditi and the offshore analysts to the point where they run Provisional Approvals with review rather than direction.


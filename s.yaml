## Conclusion

Validation reviewed the foundation large language model version upgrade from GPT-4o to GPT-5.1 and the business line's comparative performance testing. [TBD: one-sentence result statement.] The change alters no other component of the model, and the controls from the existing approval remain in effect. Validation identified no concerns that would prevent continued pilot use on the GPT-5.1 configuration prior to completion of a full validation. [TBD: confirm after testing review.]

The pilot duration remains 05/04/2026 through 11/01/2026 and the restriction effective date remains 11/01/2026; no approved dates change under this Provisional Approval. Validation recommends an Approved with Restriction outcome approving the GPT-5.1 version upgrade for pilot use under the same restrictions as the existing approval, which remain unchanged and are reiterated below. The pilot is restricted to a maximum of 148 experienced agents selected from approximately 450 total users, all of whom have received training on the solution; it is limited to Global Treasury Management and Money Movement Platform queries, and the knowledge base is restricted to 800 articles during the pilot. No further changes to the model framework, output, or scope are permitted during the pilot; any subsequent change requires a new Provisional Approval or submission for Initial Validation prior to deployment.

Validation reiterates the following observations and recommendations from the PA2, which remain open and become more relevant with the version upgrade:

- Strengthen the combined answer synthesis prompt, including explicit handling for unanswerable queries, a constraint to ground the combined answer only in the provided answers, per-answer delimiters in the input, and adaptation of the prompt formatting to the current model interface. The prompt retains Llama-2 style system tags carried over from a prior implementation; the move to GPT-5.1 is a natural point to adapt it. This will be assessed during the Initial Validation.
- The model owner should complete the root cause analysis of the incorrect combined answers identified in the PA2 evaluation (retrieval ranking versus knowledge base coverage) and confirm whether the behavior persists on the GPT-5.1 configuration.
- Add per-article delimiters to the evaluation export and logs so each combined answer can be traced to its source articles. Target the Initial Validation; if not delivered by then, it would be documented as a Finding, for delivery during ongoing monitoring.
- Continue to communicate knowledge base article changes, given that some pilot links previously returned access errors.

The next validation activity is the Initial Validation. The model owner should submit the complete documentation package (Model Development Document, Monitoring Plan Document, and Implementation Framework and Testing Document), updated to reflect the GPT-5.1 configuration, sufficiently in advance to allow the Initial Validation to be completed before the pilot concludes on 11/01/2026.

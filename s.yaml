- Sheet rows 27 and 30, and any other row found under the previous bullet: for each of the six columns, typed or formula, raw content and displayed value.

### Block V: the counts

V1. The two flags, by rail.
- S&P Global flag: TRUE, FALSE, BLANK, OTHER. TRUE rate on all records and on records judged (TRUE plus FALSE).
- D&B flag: the same.
- Both TRUE, S&P Global only, D&B only, neither, not judged.
- Sheet rows of every record whose S&P Global flag is anything other than TRUE, and the same for D&B.

V2. How the S&P Global calls were made, by rail.
- Records where `llm_spg_entity_id` equals `sp_spgid`, and records where the two differ.
- Within each: flag TRUE, FALSE, BLANK, OTHER. The TRUE rate on the records where the ids differ.
- The same for D&B, with `dnb_entity_id` against `sp_duns_number`.

V3. By stored-procedure source.
- One line per rail and distinct `sp_duns_source` value, null included: records; S&P Global ids equal to the stored procedure's; S&P Global flag TRUE, FALSE, BLANK, OTHER; D&B flag TRUE and FALSE.
- The same by group. Account or customer: `USB SETTLEMENT`, `AC360_cross_reference`, `primary_account_source`. Name match: `Distinct_Name_Substring`, `Business Name Exact Match`. `SPG Duns Internal Cross Reference` on its own. Null on its own. Any other value found on its own line.
- For each group, by rail and in total: records; LLM version and stored procedure returned the same S&P Global entity; S&P Global flag TRUE over records.

V4. Records with an S&P Global flag other than TRUE.
- For each: sheet row, rail, normalized flag, typed or formula with the raw formula, reason text, `sp_duns_source`, whether the ids equal the stored procedure's, and whether `sp_spgid` equals the id the settlement formulas key on.
- Counts by rail and by the groups of V3.
- For records with a null `sp_duns_source`: whether the stored-procedure columns still carry an entity id and name.

V5. LLM version against VectorDB version.
- By rail: records where `llm_spg_entity_id` equals `vdb_spg_entity_id`, and records where the two differ, with the sheet rows of the differing records.
- The same for the D&B ids, if the tab has a VectorDB D&B id column. Name the column used.

V6. The two new columns.
- The profile of each, by rail.
- Where they are filled: rows with column A filled and S&P Global ids different between the versions; rows with column A filled and ids equal; rows with column A empty and ids different. List the sheet rows of each set.
- For every row in any of those three sets, in the row-lists file: sheet row, rail, column A value, column B text, S&P Global flag (normalized), S&P Global reason, D&B flag, LLM S&P Global score, VectorDB S&P Global score, `sp_duns_source`, LLM id equal to the stored procedure's, VectorDB id equal to the stored procedure's, and the masked input with the two entity names.

V7. Column A against the S&P Global flag.

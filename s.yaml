## Initiative

| Field | Answer |
|---|---|
| Initiative name | MRM-AI Validation |
| Estimated date of delivery | 2027-03-31 |

### Initiative description

Paste:

MRM-AI Validation is a Python toolkit that Model Risk Management (MRM) validators use to assist second-line validation of generative AI models. It scores model responses against defined metrics (LLM-as-a-judge), groups text by topic, and generates synthetic test data. A validator reviews every output and makes all validation conclusions. The toolkit runs in the IT development environment as local desktop applications and notebooks, and it calls Azure OpenAI (GPT-5.1 and the text-embedding-ada-002 embedding model) through the enterprise API gateway operated by AI CoE Support. Inputs are model development documentation, knowledge base content, and test or synthetic datasets, which are treated as confidential. The toolkit handles no personal data, PII, or PCI, and no production data. It has about ten internal users, no customer-facing use, no access from outside the bank network, and no connectors, and it exposes no APIs. A planned next phase adds a documentation completeness check, suggested validation activities, and first drafts of validation report sections, each reviewed by a validator. The build approach and platform for that phase are being determined. 1LOD AI Risk rated the use case Tier 2 - Moderate Risk (Risk ID 3123) and listed this EngageUs request as a next step in its approval dated 11/06/2026.

### Current State

Paste:

Model Risk Management (MRM) validators assess generative AI models largely by hand. They review model responses one at a time against evaluation criteria, group test questions and knowledge base content by topic, and write test cases, and they record the results in validation workpapers and reports. A Python toolkit assists this work in the IT development environment through the enterprise API gateway, with LLM-as-a-judge scoring, topic modeling, and synthetic test data generation. A validator reviews every output before it is used, and the toolkit makes no validation decisions.

### Target State

Paste:

The toolkit continues as described, and the next phase adds three kinds of task support for the validator: a completeness check of submitted model development documentation against MRM's documentation requirements, suggested validation activities and tests for the validator to consider when planning a validation, and first drafts of validation report sections for the validator to revise. The validator reviews the completeness result and sends the documentation feedback to the model developer, and nothing leaves MRM without that review. Validators write every conclusion, Finding, and outcome. There is no customer-facing use and no automated action in other systems.

### Customer Impact

Paste:

No impact to U.S. Bank customers. The toolkit is internal to Model Risk Management and has no customer-facing use. The employees affected are the MRM AI validation team, about ten validators, who use the toolkit as an aid in their own validation work. Locations: United States.

### Technology Impact

Paste:

MRM-AI Validation, CAR ID 11342 (APM0010562), component 11342.1 Open AI Dev Environment, in Development lifecycle status. The toolkit calls Azure OpenAI through the existing enterprise API gateway. It creates and modifies no APIs and no cloud resources, adds no integration with other systems, and needs no new CAR ID.


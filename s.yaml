## 5. Tests

Definitions used below:

- Rail: the value of `llm_sor`.
- Same entity: equal S&P Global ids after the id cleaning in Section 3. Where an id is null on one side, the comparison is null, not different.
- CLEAN(name): uppercase, punctuation replaced by a space, spaces collapsed, trimmed.
- CLEAN2(name): CLEAN, then remove digit-only tokens and any digit run glued to the front of a word, then remove legal-form tokens wherever they appear (INC, INCORPORATED, LLC, LLP, LP, LTD, CORP, CORPORATION, CO, COMPANY).
- Name class of an entity name E against an input I, both under CLEAN2, evaluated in this order:
  1. Equal: I equals E.
  2. Input completes to entity: I is a prefix of E, which is what a cut-off input looks like.
  3. Entity is a leading fragment: E is shorter than I and is a prefix of I. Split this class by the number of tokens in E (one, two, three or more).
  4. Other: neither. Report a similarity ratio for these and name the measure used.


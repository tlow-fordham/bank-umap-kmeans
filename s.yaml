### Decision Recommendation Rationale

Paste:

The Python toolkit is recommended. It uses the bank's existing enterprise API gateway and Azure OpenAI service, and it adds no new technology, vendor, cloud resource, or integration. It handles no personal data, PII, or PCI, and no production data. A validator reviews every output and makes all validation conclusions, so the toolkit takes no decision and no automated action. It already operates within the development scope that 1LOD AI Risk approved at Tier 2 - Moderate Risk (Risk ID 3123). Manual validation without AI tooling leaves scoring, topic grouping, and test case writing fully manual.


# Model-7306 PayVIEW - GTM and MMP ChatBot - Meeting Minutes

**Date:** 09/21/2026
**Subject:** Discuss Rebuild of Model 7306
**Attendees:** Bob Larson (Model Risk Management (MRM)), Xinyu Wu (MRM Validation), Model Risk Governance (MRG), PayView business line team
**Prepared by:** MRM Validation

## Purpose

Working session between MRG, MRM Validation, and the PayView team to decide the path for Model-7306 PayVIEW - GTM and MMP ChatBot, and to set governance expectations for the PayView team's upcoming GenAI and agentic AI initiatives.

## Model-7306 Retirement

- The business line confirmed that Model-7306 will not be rebuilt and will not be migrated to the newer GPT version.
- The use case has already been removed from production. All parties agreed the model will be formally retired rather than upgraded.
- MRG advised the PayView team to initiate the retirement process through its MRG contact so the model is removed from the model inventory and the associated governance records.
- The business line's position is that AI capabilities have advanced substantially since the original project began, and that effort is better directed to the next generation of AI capabilities and agents currently under development.

## Governance Changes and EMQ Requirements

- MRG summarized its recent streamlining of governance processes. Under the updated guidance, not all AI use cases require an EMQ submission.
- The guidance differentiates AI solutions that qualify as models, which require MRG oversight, from AI solutions considered non-models, which proceed under the AI Policy framework.
- The first line of defense will take a larger role in determining the appropriate path using updated risk-based criteria.

## Historical Observations on Model-7306

- The business line stated that the original use case might have been categorized differently under today's framework, and that there had been uncertainty over whether the chatbot functionality should have gone through the full model risk process.
- The business line also described prior confusion over the distinction between material and immaterial model changes, whether LLM version upgrades trigger governance review, and the validation expectations for model upgrades.

## Upcoming Change Management Guidance

- MRG stated that additional change governance guidance is forthcoming. Future sessions will cover material versus immaterial changes, streamlined review requirements, expected validation and documentation requirements, and faster pathways for lower-risk changes.
- The PayView team asked to be included in the upcoming workshops and communications.

## Future PayView AI Agents and Intake 854

- The PayView team expects to develop multiple AI-powered agents and use cases in the coming months. Many may be classified as non-models; the team expects some to qualify as models because they may incorporate predictive capabilities and advanced analytics.
- Intake 854 is the umbrella AI CoE intake for PayView's AI initiatives and associated business value tracking. Individual agents developed under it will be evaluated separately and may carry their own MRG, AI Registry, Prism, or risk-review requirements while still rolling up to the same business initiative.
- The group discussed the need for clear reporting and value attribution so leadership can see how multiple AI use cases relate to the single intake.
- MRG encouraged the business to bring new AI initiatives forward early so the proper governance path is identified before development scales and rework is avoided.

## Action Items

- PayView team: work with the MRG contact to formally retire Model-7306.
- MRG: schedule a follow-up session covering the new EMQ process and governance requirements.
- MRG: include the PayView team in the upcoming change management workshops.
- PayView team: define how future AI agents under Intake 854 will be tracked, valued, and reported.
- All parties: continue coordinating on governance requirements for upcoming PayView AI agents and potential new models.

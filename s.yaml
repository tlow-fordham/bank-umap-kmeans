### Executive Summary

Validation recommends an Approved with Restriction (Time-bound) outcome for the pilot use of the Large Language Model (LLM) version of Model-7158 Entity Name Resolution as a Service (ENRaaS) on the Automated Clearing House (ACH) Originated and ACH Received payment rails from 12/14/2026 through 6/15/2027. The pilot is restricted to 60,000 input records per month in total across the two rails, selected by the Business Line from the consumer-filtered population, and the language model, prompts, thresholds, and weights are fixed for the period.

The December 2025 Provisional Approval assessed the VectorDB version of the model, a retrieve-and-rank design that matches payment-transaction names to S&P Global and Dun & Bradstreet (D&B) entities. That review found the design conceptually sound and the reference data reliable, and a Subject Matter Expert (SME) review judged 70 of 82 accepted matches correct (85.4 percent). That assessment stands for the LLM version, which replaces the VectorDB version and keeps its design and its two reference data sets. The LLM version adds one language model, GPT-OSS-20B, in three uses. It rewrites the input name to support a second retrieval pass, it infers the industry sector of the input entity from its ACH transactions, and it supplies industry labels for S&P Global reference entities that lack one.

The Business Line already resolves records through its stored procedures, an existing rule-based process that is outside this model. The Model Owner's stated purpose for the pilot is to determine on which segments of ACH records the LLM version improves on the stored procedures and could replace them, and on which segments the stored procedures remain the better method, for example settlement payments. The pilot runs the LLM version in parallel with the stored procedures on the same production records, so that the two sets of results can be compared by resolution technique and by payment rail before a decision on permanent implementation is made. The Business Line's position is that production is the most practical setting for this comparison, because the resolution process depends on current production data and reference tables. The Model Owner stated that moving that data to the development environment is onerous because of its sensitivity.

The consequence of an incorrect resolution during the pilot is limited. The Model Owner stated that accepted resolutions are used internally, for research by commercial bankers, and the model operates on completed transactions, after payment execution. The pilot is limited in volume, to two payment rails, and to six months, the model configuration is fixed for the period, and the Business Line reviews 200 accepted resolutions on each rail every month. Given the purpose of the pilot, the limited consequence of an incorrect resolution, and the restrictions on scope and duration, Validation has no concerns with the pilot use of the LLM version.

Performance testing was an SME review by the Model Owner of 132 resolutions that the Automated Acceptance Rules accepted, 32 on ACH Originated and 100 on ACH Received. The Model Owner judged the S&P Global result correct on 25 of 32 records on ACH Originated (78.1 percent) and on 90 of 100 records on ACH Received (90.0 percent). Both rates meet the Business Line's expectation of at least 70 percent precision for accepted outputs, which the December 2025 approval recorded. For this use, an input name is short and often truncated and the reference data holds more than one entity under the same or a similar name, so more than one answer can be correct for one input, and an input may have no counterpart in the reference data. [NEW - Jordan's addition of 11/18/2026. Basis: the truncated input names and the repeated entity names in the SME workbook. The statement that an input may have no counterpart is not yet tied to a source. Please confirm before finalizing.] Validation reconciled these results to the record-level workbook, and the information provided is sufficient to support the requested pilot use. The sample is limited, every reviewed record also carries a stored-procedure entity, and the results were produced with a different language model from the one configured for the pilot. Validation records these and the other testing limitations in the Model Performance section. The performance of the LLM version will be assessed at the Initial Validation on the pilot results.

Risk is mitigated through controls described by the Business Line. The controls of the December 2025 approval carry over unchanged, namely the upstream consumer filter and Customer 360 scrub, the name-restoration function, and the Automated Acceptance Rules as the output control. The guardrails on the LLM steps sit at the use-case application layer and are described by layer in the Guardrails section, and the further controls for the period are in the Risk Mitigation section.

During early engagement, Validation identified that the industry inference step recorded an LLM answer with no valid industry sector as Agriculture, and in response the Model Developer revised the code so that such an answer is recorded as unknown. The Model Developer and Model Owner also addressed Validation's early engagement observations on the documentation of the offline labelling use, the Model Developer named in the change EMA, and the design of the SME review.

The December 2025 pilot of the VectorDB version ran from 12/9/2025 to about 3/31/2026 and ended when the application migrated from the Greenplum environment to Azure. Per the Model Owner, records of the monthly SME reviews in that period are unavailable following the migration, and the four recommendations of that approval remain open. They are carried forward for the LLM version in the Conclusion, together with Validation's early engagement recommendations on the LLM components.

### Model Purpose and Usage

The purpose of Model-7158 Entity Name Resolution as a Service, its owner, its reference data, and the tiered resolution funnel it sits at the end of are unchanged from the December 2025 Provisional Approval. The Enterprise Analytics and Customer Experience Money Movement Analytics team resolves business names from completed payment transactions to S&P Global and D&B identifiers. The Business Line's stored procedures are its existing deterministic and rule-based resolution process, and they are outside this model. They resolve the exact matches first, and the model's accepted outputs update the database behind the party summary used by commercial bankers. The Automated Acceptance Rules, which screen the model's output, are a separate set of Business Line rules. The model operates on post-processed data from completed transactions, after payment execution.

The LLM version replaces the VectorDB version, which is no longer in use. The December 2025 approval of the VectorDB version expires 11/30/2026, and the status of that pilot is in the Risk Mitigation section. That approval covered five payment rails. The LLM version is requested for ACH Originated and ACH Received only. Records on Check, Wire, and Corporate Card are resolved by the stored procedures alone.

The Model Owner's stated purpose for the pilot is to determine on which segments of ACH records the LLM version improves on the stored procedures and could replace them, and on which segments the stored procedures remain the better method. The stored procedures resolve records through several techniques, which the resolution source field identifies, including account lookups, cross references to existing customers, and name matching. The Model Owner explained that some of these techniques use account or customer information and that the LLM version works from the name on the record, and gave settlement payments as an example of a segment where the Model Owner expects the stored procedures to remain the better method. These are the Model Owner's expectations ahead of the pilot and remain to be tested in it. Because the stored procedures use several techniques, the pilot is the Model Owner's means to show on which segments the LLM version is suitable and whether that suitability is narrow or broad.

During the pilot, the Model Owner selects records by resolution source and runs the LLM version in parallel with the stored procedures on the same production records, with the two results held in separate tables and compared. The Business Line's position is that production is the most practical setting for this comparison, because the resolution process depends on several interconnected and current data sources, including the S&P Global and D&B reference data, and reproducing them in the development environment requires moving, synchronizing, and validating multiple production tables before each test. The Model Owner stated that this transfer is onerous because of the sensitivity of production data. Development testing covered one load of 138,193 ACH records, and the Business Line reported a monthly eligible population of 2,004,157 ACH records (467,308 ACH Originated and 1,536,849 ACH Received). [TBD: Question 3 of the request form to carry this purpose and reason, which the Model Owner and Business Line stated in the early engagement sessions; the change is requested from the Business Line.]

The pilot population is selected by the Business Line from the consumer-filtered ACH records, up to 60,000 records per month in total across the two rails, against the monthly eligible population of 2,004,157 records (3.0 percent). The selection includes records the stored procedures resolve and records they leave unresolved. The December 2025 pilot ran on the unresolved records only. The request form sets a toll-gate decision at 3/15/2027 and states that the criteria for the comparison will be finalized with the Artificial Intelligence Center of Excellence and the Model Developer. The only downstream use of accepted resolutions in scope for the period is the party summary used by commercial bankers, a research view of a client's payment counterparties and outside banking relationships, as recorded in the change EMA. The request form describes the use as analytics and reporting.

**Validation Commentary:** Validation has no concerns with the purpose and the use proposed for the period. A time-bound pilot in production is a reasonable means for the Model Owner to determine where the LLM version is suitable, provided the restrictions in the Conclusion and the Business Line's controls described in the Risk Mitigation section are in place, because the existing process stays in place during the pilot and the consequence of an incorrect resolution is limited. The toll-gate criterion is the Business Line's decision rule, and Validation notes in the Conclusion that it is to be stated with its base before the toll-gate date.

### Development Data

The reference library (S&P Global and D&B records in the Entity Database, with the entity name embedded by bge-small-en-v1.5 in the Vector Database) and the original query development data are unchanged from the December 2025 Provisional Approval. The reference tables hold about 92.3 million D&B and 40.5 million S&P Global records, refreshed on demand about three to four times a year. The configuration file sets the entity registry and the vector store at the same version, dated 7/14/2026. Two data elements are new with the LLM version.

**S&P Global industry code enrichment.** Some S&P Global reference entities carry no North American Industry Classification System (NAICS) code, which the industry-similarity term needs. The Model Developer fills the gap in three steps: a D-U-N-S cross-reference to the D&B code where one exists, a mapping from the entity's S&P Global industry attributes where the mapping is unambiguous, and, for the remainder, GPT-OSS-20B inferring the single most likely three-digit code from the entity name and S&P Global industry fields. About 3.4 million entities, about 8 percent of the S&P Global reference population, received an LLM-inferred code in the current build. The Model Owner states that the inferred labels are used as one similarity signal within the confidence score and that their accuracy is unassessed.

**Transaction data for industry inference.** For each input entity with at least ten ACH transactions in the observation window, the runtime aggregates the counterparty names, counterparty types, bank names, and payment descriptions into an evidence summary that is sent to GPT-OSS-20B. Per the Model Developer, the observation window runs back to 1/1/2022, with a limit of 1.5 million transactions per batch on each rail. Entities below the ten-transaction floor receive no industry term. The Model Owner's position is that ACH transaction data carries no personal information and that the summaries contain business names and transaction usage only. The request form states this as a model assumption, and the consumer filter and Customer 360 scrub run before any record reaches the LLM steps.

**Evaluation data.** The Model Owner's SME review is drawn from the evaluation data set, a set of 138,193 ACH records (32,832 ACH Originated and 105,361 ACH Received) that the Business Line built from the production load of 10/10/2026, after the S&P Global data in the vector database was brought into line with the entity database. The review covers 132 of the 7,597 resolutions that the Automated Acceptance Rules accepted on that data set. The evaluation data set replaced an earlier comparison workbook of agreement rates with the stored procedures and of acceptance-rule pass rates on May and June 2026 load days.

**Validation Commentary:** Validation identified the offline labelling of S&P Global entities during the code review and raised it with the Model Developer, who documented it in the form with the stated limitation. Validation has no concerns with the reference data, as assessed in the December 2025 approval, or with the evaluation data set as the base for the SME review. The accuracy of the inferred NAICS labels is noted for the Initial Validation in the Conclusion.

### Model Theory and Construction

The two-stage retrieve-and-rank framework and the bge-small-en-v1.5 embedding model are unchanged from the December 2025 Provisional Approval, which found the framework conceptually sound and assessed the embedding model. That framework comprises a vector search on the input name, a weighted similarity score over name, geographic, and contact measures, uniqueness-based rescaling by the gap between the top two candidates, and the ambiguity adjustment of multiple high scores to below 0.9. The LLM version adds one language model, GPT-OSS-20B, to that framework, where it has three uses: a name rewrite, an industry inference at runtime, and an offline labelling of reference entities. The model is used as released, with no fine-tuning on bank data, and it calls no tools or external services. The request form describes the model as hosted on NVIDIA DGX infrastructure, and the configuration file provided by the Model Developer calls it at an endpoint on a U.S. Bank network domain.

#### Foundation Large Language Model

GPT-OSS-20B (model ID gpt-oss-20b) is an open-weight mixture-of-experts model released by OpenAI, with about 21 billion parameters, about 3.6 billion active per token, and a 131,072-token context window. The configuration file names it as the only language model and calls it through an application programming interface (API), with a temperature of 0.01. The model takes text input and returns text output.

Published benchmark results are available for the model. The model's tasks in this use, name normalization and sector classification from a transaction summary, are specific to it, so the evidence of performance for the pilot is the SME review in the Model Performance section.

#### Model workflow

An input business name proceeds through the following stages.

1. Candidate retrieval. The vector search on the input name returns 50 candidate entities from the reference library, per the Model Developer, and the configuration file sets the search candidate count at 50.
2. Name rewrite and second retrieval pass. Where the best candidate's initial confidence score is below 0.8, the threshold set in the configuration file, GPT-OSS-20B is prompted with the input name to return a likely official business name, and the vector search is repeated on the rewritten name. Candidates from the second pass are scored like any other.
3. Industry inference. Where the input entity has at least ten ACH transactions in the observation window, GPT-OSS-20B classifies it into one of the twenty two-digit NAICS sectors from the evidence summary described in the Development Data section. Entities without sufficient transactions receive no industry term.
4. Confidence scoring and re-ranking. Each candidate receives the raw similarity score of the VectorDB version, blended with the cosine similarity between the inferred sector and the candidate's NAICS code in a learned projection of NAICS descriptions, at a fixed industry weight of 0.01. Uniqueness-based rescaling and the ambiguity adjustment then apply as before.
5. Resolution output. The highest-scoring S&P Global candidate and the highest-scoring D&B candidate are returned with their confidence scores. The two reference sets are matched independently, and the S&P Global identifier is the primary output. The model always returns an output, and the Business Line's Automated Acceptance Rules decide whether a resolution is accepted.

#### Prompts

The three prompts are reproduced in the appendix of the request form. The name-rewrite prompt instructs the model to normalize the input name and infer the most likely official business name from its learned knowledge only, and to return one JavaScript Object Notation (JSON) object with the name, an address, a description, and a confidence value. The runtime industry prompt instructs the model to classify the entity into one primary sector from the list of twenty using only the evidence summary, returning strict JSON with the primary sector, three ranked sectors with probabilities, a confidence value, and rationale terms. The offline labelling prompt instructs the model to infer a valid three-digit code for each reference entity in a batch from its name and S&P Global industry fields, choosing the closest reasonable code when uncertain.

Prompt and response together use a small share of the model's 131,072-token context window: about 1,960 tokens for an industry inference and about 6,900 tokens for a labelling batch of 60 reference entities, as measured on the code package. Each call is a single-turn prompt with no conversation history.

**Validation Commentary:** Validation reviewed the code package for the foundation, runtime, and common modules, the Model Developer's written description of the flow, the configuration file, and the three prompts. The LLM steps supply additional candidates and one similarity term, and the existing scoring and the Automated Acceptance Rules determine the match, which preserves the controls the December 2025 approval relied on. Validation has no concerns with the design for the use proposed for the period.

Validation identified during early engagement that the industry inference step recorded an LLM answer with no valid NAICS sector as Agriculture, with a probability of 1.0. Validation raised this early engagement observation with the Model Developer, who stated that the result was unintended and revised the code so that such an answer is recorded as unknown. Validation reviewed the revised function that the Model Developer provided. The inferred sector is one similarity signal in the ranking of candidates, and it applies to records with at least ten ACH transactions. Validation also observed that candidates in the Manufacturing, Retail, and Transportation sectors received an industry similarity of zero, because their two-digit codes were not keyed to the combined sector ranges. The Model Developer stated that the individual codes are mapped to the combined sectors in data preparation. Validation raised further early engagement observations on the documentation of the offline labelling step, an unused business-size inference in the package, and the reference-data version in the configuration files, and the Model Developer addressed them in the documentation and the configuration file. The code package provided to Validation differs from the running version in its prompts, which is the reason the December 2025 versioning recommendation is carried forward in the Conclusion. The Initial Validation reviews the code of the version that runs in the pilot.

### Guardrails

The model has no conversational interface and accepts no free-form user input. The guardrails on the LLM steps are described below by layer.

- Foundation LLM layer. GPT-OSS-20B is used as released by its developer, with no fine-tuning. The developer's model card states that the model was trained to refuse disallowed content and to defend against prompt injections, that it generally performs on par with the developer's o4-mini model on the developer's disallowed-content and jailbreak evaluations, and that it generally scores below o4-mini on the developer's instruction-hierarchy evaluations. The model card also states that developers and enterprises will need to implement extra safeguards. The three LLM steps ask for a business name, an industry sector, or an industry code in a fixed format, and a response in any other form is discarded at the use-case application layer.
- Cloud-native platform or service layer. The configuration file calls GPT-OSS-20B through an API at an endpoint on a U.S. Bank network domain, secured with the bank's certificate chain. The request form states that the LLM processing is performed within the locally hosted environment and that no external LLM service is used. The request form describes no platform-level filtering of inputs or outputs, and the configuration file carries no setting for one.
- Enterprise-wide application or guardrail layer. The request form describes no enterprise guardrail solution on the LLM calls, and the configuration file sends them directly to the model endpoint.
- Use-case application layer. The guardrails configured for this model sit at this layer.
  - Input rules. The workflow constructs every prompt from internal tables. Per the Model Owner, the consumer filter and the Customer 360 scrub are applied upstream to the ACH data before any record or transaction summary reaches the LLM steps. The industry inference runs only where the input entity has at least ten ACH transactions.
  - Defensive prompting. The name-rewrite prompt limits the model to its learned knowledge and instructs it to make up no information. The industry prompt limits the model to the evidence summary and to one sector from a list of twenty. The labelling prompt limits the model to the provided fields and to valid three-digit codes.
  - Grounding restrictions. The LLM steps use no retrieval-augmented generation (RAG). The rewritten name is used only as search text against the reference library, so the resolved entity is always a record from the reference library.
  - Output rules and fallback logic. Responses are parsed as JSON, and an invalid response is discarded. An answer with no valid sector is recorded as unknown. The score takes one input from the LLM steps, the inferred industry as one similarity term at a fixed weight of 0.01, and the confidence values returned by the model are discarded.
  - Human review. The Automated Acceptance Rules accept or reject each resolution, and human review is the Business Line's monthly SME review of 200 accepted resolutions per ACH rail.
  - Application-specific monitoring. The monthly SME review is the monitoring stated in the request form.

**Validation Commentary:** Validation reviewed the guardrails from the code package, the configuration file, the three prompts, and the developer's model card. The guardrails configured for this model are at the use-case application layer. Validation has no concerns with them for the use proposed for the period, because the resolved entity is always a record from the reference library and every output passes the Automated Acceptance Rules before use. At the platform and enterprise layers, the configuration file shows the LLM calls going directly to the model endpoint with no filter configured.

Validation noted that the fields that enter the prompts, namely input names and payment descriptions, originate outside the bank, so text written as an instruction could reach the language model. The effect is bounded by the output rules above, and the point is noted for the Initial Validation. [NEW - not discussed with the Model Owner or Model Developer. Rationale: the layered description Xinyu asked for on 11/18/2026 calls for the prompt-attack path to be addressed, and this is the only such path for a model with no user interface. Please confirm before finalizing.] The guardrail evidence for this request is Validation's code review and the Model Owner's SME review of accepted outputs.

### Model Performance

Performance testing for the LLM version was an SME review by the Model Owner on the evaluation data set described in the Development Data section. According to the request form, the model returns a result for every record, including at low confidence, and the Business Line uses only the resolutions that the Automated Acceptance Rules accept. On that data set, the Automated Acceptance Rules accepted the LLM version's resolution on 1,071 of 32,832 ACH Originated records (3.3 percent) and on 6,526 of 105,361 ACH Received records (6.2 percent). The SME review covers accepted resolutions, which are the outputs that reach use. The Model Owner drew 132 of the accepted resolutions, 32 on ACH Originated and 100 on ACH Received, and judged the S&P Global result and the D&B result on each record correct or incorrect, with a reason recorded for each judgment.

The Model Owner judged the S&P Global result correct on 25 of 32 records on ACH Originated (78.1 percent) and on 90 of 100 records on ACH Received (90.0 percent), and the D&B result correct on 27 of 32 (84.4 percent) and on 90 of 100 (90.0 percent). The LLM version's S&P Global identifier equals the stored procedure's on 67 of the 132 records, and the result is judged correct on each of the 67. On the 65 records where the two identifiers differ, the Model Owner judged the LLM version's result correct on 21 of 28 on ACH Originated (75.0 percent) and on 27 of 37 on ACH Received (73.0 percent), on a reading of the returned name against the input name. Each of the 17 results judged incorrect carries a reason about the name, and on 14 of the 17 the reason is that the names are close but too generic.

The stored procedure's result came through an account or customer technique on 58 of the 132 records. The Model Owner judged the LLM version's result correct on 44 of those 58 records (75.9 percent) and on 71 of the 74 other records (95.9 percent). Of the 74 other records, the stored procedure's result came through name matching on 40, through an internal cross reference of S&P Global and D&B identifiers on 11, and with no resolution source on 23, and the Model Owner judged the LLM version's result correct on 40, 11, and 20 of them. All 17 results judged incorrect are on records where the stored procedure used an account or customer technique (14) or carried no source (3).

The review workbook also carries the VectorDB version's result for the same 132 records. The two versions returned the same S&P Global identifier on 117 records, 24 of 32 on ACH Originated and 93 of 100 on ACH Received, and different identifiers on 15 records, 8 on ACH Originated and 7 on ACH Received. The Model Owner judged the two versions' results against each other on each of the 15 records. The LLM version's result was judged correct and the VectorDB version's incorrect on 9 records, both results were judged correct on 6 records, and the reverse case, with the VectorDB version's result correct and the LLM version's incorrect, occurred on 0 records.

On the 6 records where both results were judged correct, the Model Owner's reason is that the name matches. The two versions returned the same entity name under two different S&P Global identifiers on 3 of the 6 records (for example, Better Days), and names that differ in a suffix or a trailing word on 3 records (for example, Coca-Cola Bottling Co Inc and Coca-Cola Bottling Co.). On the 9 records where only the LLM version's result was judged correct, the reasons recorded are that the VectorDB result carries the correct name, or an element of it, in what is likely the wrong variation (4 records), that the VectorDB version's D&B and S&P Global results differ from each other or its D&B result is incorrect (4 records), and that the VectorDB result is incorrect (1 record). The LLM version's S&P Global identifier equals the stored procedure's on 3 of the 15 records, and the VectorDB version's identifier equals the stored procedure's on 0 of the 15.

**Validation Commentary:** Validation reconciled the reported results to the record-level workbook and recomputed each count from the Model Owner's judgments.

Validation reviewed the 15 records on which the two versions returned different S&P Global identifiers. The S&P Global reference data holds more than one identifier under the same or a closely similar entity name, so two different identifiers can each be a correct match for one input name, and a difference in identifier between the two versions is consistent with both results being correct. The records that the Model Owner judged correct for both versions show this pattern. Per the Model Owner, two identifiers under one name are duplicate records of one organization. Validation noted that on 3 of the 15 records the Model Owner's comparison has the LLM version's result correct while the correctness flag on the same result reads incorrect, with the reason that the name is too generic. The rates in this section use the correctness flag. [NEW - not discussed with the Model Owner. Rationale: Jordan's direction of 11/17/2026 to cover the 15 records in detail and to explain how two different results can both be correct. The examples are business names from production records, which Jordan accepted on 11/18/2026 as not personal information; names of individuals stay out of the review. The three records are sheet rows 30, 89 and 128; either the Model Owner reconciles them or the sentence stays. Please confirm before finalizing.]

Validation noted the following testing limitations.

- The sample of 132 accepted resolutions is limited. While the results are directionally informative, they may not fully capture performance variability across the records the pilot will process.
- Each of the 132 records carries a stored-procedure entity, so the review covers only records on which the stored procedures returned an entity. The Model Owner's stated purpose is to determine by segment where the LLM version can replace the stored procedures, and the review's counts by segment are small, with 58 records on account or customer techniques and 23 records with no resolution source. [TBD: what a missing resolution source means where the stored procedure still returns an entity, to be stated by the Model Owner.]
- The results were produced with Mistral-7B-Instruct-v0.3 in the name-rewrite step, and the configuration file names GPT-OSS-20B as the only language model, so the results reflect an earlier configuration of the name rewrite.
- The workbook does not identify the records on which the LLM steps ran, and the two versions returned the same S&P Global identifier on 117 of the 132 records, so the review measures the framework as a whole.
- The Model Owner judged each result on the name returned, so the review treats S&P Global entities that carry the same name as the same answer. [NEW - proposed 11/17/2026. Rationale: it states what the correct rates measure. Please confirm before finalizing.]

The December 2025 approval recorded the Business Line's expectation of at least 70 percent precision for accepted outputs, and Validation applies the same expectation to this second provisional approval. The results on both rails meet it, at 25 of 32 on ACH Originated (78.1 percent) and 90 of 100 on ACH Received (90.0 percent). The SME review of the VectorDB version in the December 2025 approval judged 70 of 82 accepted matches correct (85.4 percent). The information provided is sufficient to support the requested pilot use, given that accepted resolutions support research by commercial bankers on completed transactions, that the Automated Acceptance Rules apply to every output, and that the Business Line reviews 200 accepted resolutions per ACH rail each month. The testing limitations above remain for the pilot and the Initial Validation to address. [NEW - added 11/18/2026 per Jordan's direction that the performance is acceptable and secondary to the purpose of the pilot. Please confirm before finalizing.] The performance of the LLM version will be assessed at the Initial Validation on the pilot results.

### Risk Mitigation

The primary risk of the use is unchanged from the December 2025 Provisional Approval. An incorrect resolution could reach the party summary and misinform a banker's view of a client's counterparties. The model operates on completed transactions, after payment execution. The layered controls assessed in that approval carry over unchanged. They are the Business Line's consumer filter and the Customer 360 personal-information and card-data scrub upstream, the Model Owner's name-restoration function, and the Automated Acceptance Rules downstream, which accept a resolution on the Business Line's lexical and phonetic checks of the resolved name against the input name, in some techniques together with the model's confidence score. The Model Owner states that the acceptance rules are unchanged since the December 2025 pilot.

The guardrails on the LLM steps are described in the Guardrails section. The request form states three further controls for the LLM version during the period. The Business Line reviews 200 accepted resolutions per ACH rail each month (400 in total), drawn from the accepted population. The language model, the embedding model, and the methodology are fixed for the period, with immaterial prompt changes permitted, namely typo corrections, small wording changes, and added few-shot examples. Under the restrictions of this approval, the fixed elements include the prompts, the confidence thresholds, the scoring weights, and the candidate count, each immaterial prompt change is recorded in the change log and regression-tested before use, and any other change goes through model change management before use. The request form also states that results from the reviews will be used to refine acceptance criteria and model parameters throughout the pilot, and a refinement to any of the fixed elements is a change that goes through model change management before use. Input is limited to 60,000 records per month in total across the two ACH rails.

**Status of the December 2025 commitments and recommendations.** The December 2025 approval committed the Model Owner to a monthly SME review of 200 accepted resolutions per payment rail and set milestones for an LLM challenger from 3/1/2026, a toll-gate decision on 8/1/2026, and development documentation by 9/1/2026. The pilot ran from 12/9/2025 to about 3/31/2026 in the Greenplum environment and ended when the application migrated to Azure, about four months into its approved period of 12/1/2025 through 11/30/2026. Per the Model Owner, records of the monthly reviews are unavailable following the migration. The challenger and toll-gate milestones were superseded by the decision to build the LLM version, and the development documentation is now due 3/31/2027. The four recommendations of that approval remain open and are carried forward for the LLM version in the Conclusion.

**Validation Commentary:** Validation has no concerns with the controls stated for the pilot use, given the limited consequence of an incorrect resolution. The Automated Acceptance Rules remain the Business Line's output control, and the SME review in the Model Performance section measures the resolutions they accept. The industry term's effect on any candidate's score is bounded by the industry weight of 0.01. An incorrect name rewrite can produce an incorrect candidate with a high confidence score, and the acceptance rules and the Business Line's monthly SME review are the controls for that case.

Validation's early engagement recommendations on the Business Line's monitoring during the period are in the Conclusion.

The statement that the transaction summaries carry no personal information is the Model Owner's position, which Validation takes as stated for this approval. Validation noted that six of the 132 reviewed input names read as the names of individuals, and the point is noted for the Initial Validation. [NEW - not discussed with the Model Owner. Rationale: the form states that the model inputs contain no personal information, and the SME workbook shows input names that read as individuals. Please confirm before finalizing.]

### Risk Management Groups Approvals

The Product Risk Management Assessment for Model-7158 (PRISM-89997) was approved by the impacted Risk and Compliance Specialist (RCS) groups in January 2025, with a final decision of Approved on 1/24/2025. The review of the related Business Change Intake Questionnaire (BCIQ), BCIQ-55058072, was completed 10/9/2024, as recorded in the December 2025 Provisional Approval. The request form cites BCIQ-44548141, the business change record for the Money Movement Analytics platform. The review of that record was completed 1/2/2024, and its status is Business Change Review Complete.

The change Estimation Method Assessment (EMA) 68556408 for the LLM version, which follows the December 2025 approval without an intervening Initial Validation, was accepted by Model Risk Governance on 11/2/2026, with a risk rating of Low and a decision of Pilot - Accepted. [TBD: Model Risk Governance returned the EMA on 11/19/2026 for updates, and it was resubmitted the same day. State the acceptance date and decision once Model Risk Governance accepts the resubmitted record, and update the EMA's date in Documentation Reviewed if it changes.] The pilot period on the record is 12/14/2026 through 6/15/2027, and the Expected Date of First Use is 12/14/2026. The model version recorded in the EMA is 1.1. Model Risk Governance's review of the change EMA triggered a Fair and Responsible Banking Department (FRBD) review, and the EMA record shows acceptance pending that review, followed by acceptance as a pilot. [TBD: the FRBD decision and its date, from the FRBD tab of the EMA; Question 6 of the request form states that an FRBD review was not required.] The December 2025 EMA (60213900) had been dispositioned as not requiring an FRBD review.

### Conclusion

Validation reviewed the request form, the change EMA, the Model Developer's description of the resolution flow, the code package, the configuration file, and the Model Owner's SME review, and held weekly discussions with the Model Owner, Business Line, Model Developer, Model Risk Officer, Model Risk Governance, and Fair and Responsible Banking to understand the model's purpose, methodology, and performance. The December 2025 Provisional Approval found the retrieve-and-rank design conceptually sound, and an SME review judged 70 of 82 accepted matches correct (85.4 percent). The LLM version keeps that design and the controls that approval relied on, and adds one language model in three uses, which supply additional retrieval candidates and one similarity term.

The Model Owner's stated purpose for the pilot is to determine on which segments of ACH records the LLM version could replace the stored procedures and on which the stored procedures remain the better method, through a parallel run on production records. The Business Line's position is that production is the most practical setting for the comparison, and the Model Owner stated that moving production data to the development environment is onerous. The consequence of an incorrect resolution during the pilot is limited, and the pilot is restricted in scope, volume, and duration. In the SME review, the Model Owner judged the S&P Global result correct on 25 of 32 accepted resolutions on ACH Originated (78.1 percent) and on 90 of 100 on ACH Received (90.0 percent). Both rates meet the Business Line's expectation of at least 70 percent precision recorded in the December 2025 approval, and the testing limitations are recorded in the Model Performance section. Based on Validation's preliminary review of the information provided, Validation identified no immediate concerns that would prevent proceeding with the pilot prior to completion of a full validation.

Given these considerations, Validation recommends an Approved with Restriction (Time-bound) outcome, permitting pilot use of the LLM version from 12/14/2026 through 6/15/2027 under the following restrictions. The restriction effective date is 6/15/2027.

- Time-bound: the pilot runs from 12/14/2026 through 6/15/2027.
- Scope-bound: use is limited to the ACH Originated and ACH Received payment rails, and accepted resolutions are used only to update the party summary used by commercial bankers.
- Volume-bound: input is limited to 60,000 records per month in total across the two ACH rails, selected by the Business Line from the consumer-filtered population.
- Version-bound: the language model (GPT-OSS-20B) and its served version, the embedding model, the prompts, the confidence thresholds, the scoring weights, and the candidate count are fixed for the period, with only the immaterial prompt changes defined in the request form permitted, each logged and regression-tested before use. Any other change requires model change management before use.

The monthly SME review of 200 accepted resolutions per ACH rail is a Business Line control. The Initial Validation assesses the pilot results, including the monthly review records and the record-level model outputs. The Initial Validation depends on the records of this pilot, because the review records of the December 2025 pilot are unavailable.

The December 2025 pilot ended at the platform migration before the four recommendations of that approval were evidenced, and they are carried forward for the LLM version.

- Conduct formal tests to provide evidence that the input scrub (the consumer filter, the Customer 360 scrub, and the name-restoration function, now including the transaction summaries sent to GPT-OSS-20B) and the Automated Acceptance Rules perform as described.
- As part of the monthly monitoring, track the distribution of confidence scores within the accepted population and the thresholds required to meet the accepted volume, to detect model or data drift as the industry term changes the score distribution.
- Maintain strict software and model versioning, with the code, the configuration, and the prompts under version control and the running version synchronized to the repository the results are produced from, so that every reported result maps to the configuration that produced it. The versioning covers the served version of GPT-OSS-20B, which the configuration file identifies by name.
- Complete the model documentation for the Initial Validation to the GenAI and Agentic AI Model Development Template by the Development Documentation Due Date on the inventory record, 3/31/2027.

For the LLM components, Validation has the following early engagement recommendations for the pilot and the Initial Validation.

- Retain the monthly SME review records and the record-level model outputs (the input, the candidates from both retrieval passes, the inferred sector, the scores, and the accepted result), so that the pilot results are available at the Initial Validation.
- Record in the monthly SME review whether each accepted resolution came through the name-rewrite pass and whether it carried an industry term, so that the contribution of each LLM step and any drift in it are visible.
- Extend the regression test described in the form for embedding-model changes to prompt and language-model version changes.
- Assess the accuracy of the LLM-inferred three-digit NAICS codes assigned to the S&P Global reference entities.
- State the toll-gate decision criterion with its base before the toll-gate date of 3/15/2027, by segment of ACH records, in line with the stated purpose of the pilot.
- Record the agreed definition of an immaterial prompt change in the change EMA's model change definition field, which currently describes minor routine maintenance that could include additional input fields, so that the form, the EMA, and the change log agree.
- Document the following for the Initial Validation.
  - The content of the transaction summaries and the basis for the no-personal-information assumption.
  - The basis for the 0.8 rewrite trigger and the acceptance tiers relative to the score range observed for ACH inputs.
  - The basis for the industry weight on data other than the evaluation data it was selected on.
  - The contribution of the learned industry projection over a direct comparison of sector codes.
  - The score variant the acceptance rules read.

The next validation activity is the Initial Validation, with a target completion date of 6/15/2027, so that it completes by the end of the pilot and the production decision rests on its outcome. The Development Documentation Due Date on the inventory record is 3/31/2027.

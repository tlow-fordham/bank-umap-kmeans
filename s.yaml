## 7. Results files

Names: `YYYYMMDD_Model-7158_enraas_perf2_Updated_Workbook_Recount_Results.md` and `..._Recount_Row_Lists.md`, with the date of the run.

The files reach the requesting session as photos of a screen, so they must survive that trip.

- Results file of 220 lines or fewer. Tables of eight columns or fewer. Lines of 110 characters or fewer.
- Begin every section with its test id (U1, V3 and so on), so that photos can be put back in order.
- Give row lists as sheet row numbers separated by commas. Lists longer than 15 rows go in the row-lists file, with the count kept in the results file.
- Keep the script out of both files.

Layout of the results file:

1. Header: workbook path and name, modified time, last modified by, run time, script filename.
2. Headline, 15 lines at most: records by rail; the two flags by rail on basis 1; the count of OTHER and of text-typed flags; the cells changed since the last run; the three bases of V9 in one small table; the V8 table from column A; the rows where column A and the flag disagree.
3. The mapping tables of Section 4, items 5 and 8.
4. Results by test, U1 to W1.
5. The comparison with Section 6.
6. Differences from this handoff, anything not computed with the reason, and other things noticed.

Format: plain text, no emoji, no em-dashes. If Block U and V1 to V4 are ready before the rest, deliver them first.

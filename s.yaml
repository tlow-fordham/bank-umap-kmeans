## Section 7.3 additions - Risk Factors

Append after the three existing risks:

- **Funding risk:** Funding may not be approved, or may be approved below the level required for the Release 1 team described in Section 5.2, in which case scope or timeline is renegotiated per Section 4.3.
- **Management commitment risk:** Funding may be available but deferred or diluted by competing priorities, which is distinct from funding risk and is mitigated by sponsor alignment on the Release 1 commitment.
- **Procurement and onboarding timeline risk:** Contractor selection, contracting and access provisioning have historically taken one to two months, and prior offshore engagements were repeatedly blocked on access. A slip here compresses the Release 1 build window. Preliminary design and data preparation by internal teams during selection, as stated in Section 4.2, is the mitigation.
- **Knowledge concentration risk:** Contractor staff may rotate or leave, taking program knowledge with them. Mitigated by bank-owned repositories for all artifacts, documentation standards and scheduled knowledge transfer per Section 5.4.
- **Classification risk:** If MRG classifies any delivered capability as a model rather than a tool, that capability would require inventory, an Estimation Method Assessment and independent validation, changing scope and timeline. Mitigated by the design controls in Section 2 and early engagement with MRG per Section 10.
- **Data confidentiality risk:** Contractor access to model development documents and validation reports, which are confidential and in some cases describe models the contractor's firm may serve elsewhere. Mitigated by the data boundary in Section 5.4 and the conflict screen in Section 6.
- **Scope breadth risk:** Requirements spanning six workflows across two lines drafted on a short timeline may be shallow in places. Mitigated by staged functional design per release in Section 4.3.
- **Duplication risk:** Parallel first-line initiatives may overlap this program's scope. Mitigated by the interdependency register in Section 5.6 and shared program governance with the AI Center of Excellence.
- **Key-person risk:** Internal program management is concentrated in two individuals at approximately one full-time equivalent combined, alongside their validation workload. Mitigated by documented requirements and decisions, and by the Model Development and MRG counterparts in Section 5.1a.

## Section 8 restructure - Cost Components, Funding Sources and Value

Replace the current single narrative with three subsections. Dollar amounts are not included at this stage; line items are enumerated so that costs can be estimated with Finance once the funding path is determined.

### 8.1 Cost Components

Build (Release 1, with subsequent releases estimated per Section 4.3):

- external team labor by role and duration;
- internal program management and subject matter expert time;
- language model and API usage on the enterprise gateway for development, testing and evaluation;
- compute and storage across development, user acceptance and production environments;
- developer tooling and platform seats;
- data preparation, including pseudonymization of the reference corpus;
- security, privacy and legal review effort for the risk process; and
- test environments and test data.

Ongoing (annual, from Release 1 production use):

- platform and language model usage at production volume;
- monitoring, observability and cost attribution tooling;
- the technology platform owner described in Section 9, estimated at a partial full-time equivalent;
- support and maintenance, whether by retainer or internal equivalent;
- re-evaluation effort at each enterprise gateway model retirement, on a roughly quarterly lifecycle;
- licensing;
- user training and adoption support; and
- knowledge transfer and transition activities at the end of each release.

### 8.2 Funding Sources

More than one funding path is available, and the choice affects which cost components each source would naturally carry.

- **AI Center of Excellence:** Funding for AI initiatives is available through the first-line AI Center of Excellence under Prashant, which is the primary path discussed with sponsors and would naturally carry external team labor and platform costs for capabilities serving model developers.
- **Risk Management and Controls Innovation and Transformation Office:** The office under Amy Steingrebe, reached through Casandra Kerr as Model Risk's AI Coordinator, has offered resources against the registered initiative (AI Center of Excellence intake 1286).
- **Model Risk Management:** Internal program management and subject matter expert time.
- **Technology:** Environment, gateway and ongoing platform ownership costs.

The sourcing route for the external team is open among an internal global capability center engagement, an existing consulting relationship, and a request for proposal; the route chosen constrains both the funding source and the onboarding timeline in Section 4.2. [INPUT: sourcing decision.]

### 8.3 Value

The investment is expected to generate value through reduced manual effort and rework, shorter lifecycle cycle times, improved first-pass submission and validation quality, and increased capacity for Model Development and Model Risk staff to focus on judgment-intensive activities, measured against the indicators in Section 3. Baseline values for each indicator are captured during Release 1 design, before the tooling changes behavior, so that realized value can be measured after release. The existing value statement for intake 1286 rests on effort avoidance; the external team cost introduced by this program will be evaluated against the same indicators.

## Section 9 additions - Ongoing Technology Ownership and Change Control

Append to the existing list:

- **Platform ownership:** A formally assigned technology resource, estimated at a partial full-time equivalent, owns the platform after each release: environments, data flow, storage and usage, access provisioning and removal, gateway and vendor coordination, and incident routing. The owner is to be determined; the requirement is recorded so that the receiving organization plans for the capacity. [INPUT: owning organization.]
- **Change control:** Review criteria, prompts, templates, workflow configuration and reference data are version-controlled. Any change to prompts, criteria or the underlying language model, including changes driven by enterprise gateway model retirements, triggers a re-run of the evaluation harness against the reference sets before release, and each production run records the versions used.
- **Classification re-confirmation:** The tooling's classification is re-confirmed with MRG at each scope expansion that changes who the users are or what the outputs feed, for example when assessment and finding drafting are added or when model developer users are onboarded.

## Section 10 (new) - Governance and Risk Process

The program's capabilities are internal-facing tools that support, and do not replace, human decisions. The classification of each capability is determined by MRG; the program assumes classification as non-model AI on the basis of the design controls in Section 2, namely that acceptance and readiness recommendations are computed against MRM-defined thresholds from evidence-cited checks and confirmed by an authorized reviewer, that outputs do not form part of the validation record without human review, and that review criteria remain MRM-owned artifacts.

Before Release 1 enters business use, the following steps are completed and recorded as milestones in Section 4.2:

1. MRG classification confirmation for each Release 1 capability.
2. Submission through the business change intake (BCIQ) and the risk program review (PRISM) as internal-facing non-model AI, with a package covering workflow architecture, data scope and classification, access model, human-in-the-loop controls and traceability.
3. Review by Information Security, Privacy and Legal through that process.
4. Registration of the capabilities in the enterprise AI use case registry under intake 1286.

Data handling follows enterprise data classification. Model development documents and validation reports used as reference data are confidential; external team access is limited to pseudonymized copies unless raw access is explicitly granted under the applicable rules. All runs retain the inputs used, the criteria and prompt versions applied, the intermediate graded results with their evidence citations, the reviewer decisions and the final outputs, so that any recommendation can be reconstructed for internal audit or regulatory examination. Governance of first-line use follows the independence boundary in Section 2: capabilities exposed to model developers are limited to completeness and consistency checks against published requirements.


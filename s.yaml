---

## Reason for the pilot

Validation asked the MO and BL to describe the reason for the pilot so that it is documented accurately.

- Purpose. The LLM version is a new method, and the purpose of the pilot is to determine which segments of ACH records benefit from it. The MO confirmed this purpose.
- Resolution techniques. The stored procedures resolve records through several techniques, which the resolution source field identifies, such as USB Settlement, AC360 cross reference, and distinct name substring. The MO explained that some of these techniques use additional account or customer information, while the LLM version works only from the name on the record. The MO's position is that records resolved through those techniques are better left to the stored procedures, and that the records the stored procedures leave unresolved are the ones to send to the LLM version. These are expectations ahead of the pilot. With several techniques in play, only the pilot can show on which segments the LLM version is suitable and improves on the stored procedures, and whether that benefit is narrow or broad.
- Parallel run. In production the MO can select the records to send to the LLM version by resolution source and run the LLM version in parallel with the stored procedures, with the two results held in separate tables and compared.
- Why production. Running this comparison in the development environment requires moving the production data that the resolution process uses into development. The MO stated that this transfer is onerous because of the sensitivity of production data, and that it is more practical to bring the model to the data than the data to the model.
- Validation will document this purpose and this constraint in its review of the request.

## SME review workbook

- The MO provided an updated workbook with four columns recording the MO's review of whether each S&P Global result and each D&B result is a match. The review is the MO's best estimate from visual inspection and covers the LLM version's results.
- The MO will add an assessment of the VectorDB version's result on the records where the two versions return different results.
- The 132 records were drawn in SQL from the LLM version's results that the acceptance rules accepted. About 200 had been requested.
- The acceptance rules are stored procedures, and each accepted record carries the reason for its acceptance.
- On records where the stored procedures resolve through account information, such as USB Settlement, the MO assessed the LLM version's result against the input name.


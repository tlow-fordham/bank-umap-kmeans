### Block B: for the report

B1. Scores. For `llm_spg_enraas_score`, `llm_dnb_enraas_score`, and `vdb_spg_enraas_score`, by rail:
- Count, minimum, percentiles 1, 5, 10, 25, 50, 75, 90, 95, 99, maximum, mean.
- Counts in 0.05 bands, and counts at or above 0.90 and 0.95.
- The ten most frequent score values and the share of rows whose score has two or fewer decimals.
- LLM score distribution split by A6 outcome (same or different from VectorDB) and by A7 outcome.

B2. The stated rule, checked mechanically. The comment on the rows is "Three word names with first Five Characters matching". By rail, on raw names and on CLEAN names:
- Token count of the input (1, 2, 3, 4 or more) and of `llm_spg_entity_name`.
- Whether the first five characters of the input equal the first five of the entity name.
- The cross-count of the two, and up to 15 rows per rail that fit neither reading of the rule.

B3. Truncation. By rail: distribution of input name length, the share of inputs at the maximum length, and the A8 name classes split by at-maximum against shorter.

B4. Repeated inputs. Group rows by CLEAN2 of the input within a rail.
- Number of groups with two or more rows and the rows in them.
- Groups that resolve to more than one `llm_spg_entity_id`, more than one `dnb_entity_id`, and more than one `vdb_spg_entity_id`.
- The ten largest groups.

B5. S&P Global against D&B within the LLM version. By rail: rows with both results, S&P Global only, D&B only, neither. Where both exist, the name class of `llm_spg_entity_name` against `llm_dnb_entity_name` treated as input and entity in both directions, reduced to: equal, one is a prefix of the other, different.

B6. Concentration. By rail: distinct `llm_spg_entity_id` count, the share of rows in the top 1 and top 10 entities, and the 25 most frequent entities with counts.

B7. Inputs that read as individuals. A screen only. Flag an input when it has two to four alphabetic tokens under CLEAN, no legal-form or business word, and either a professional or generational suffix (MD, DNP, DDS, DO, DMD, DC, PHD, JR, SR, II, III) or a first token found in a given-name list available locally. State the list used, or that none was available. Report the count by rail, the A8 name class of the flagged rows, and up to 15 masked examples per rail.


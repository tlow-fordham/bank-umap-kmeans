The workflow runs in three phases:

1. **Intake and setup.** The development document is ingested and split by section, legacy-template submissions are mapped to the current section structure, and the workflow pauses at the first validator checkpoint.
2. **Section review.** The sections are distributed to parallel review agents, agent failures are handled by retry and then by explicit alert, a cross-section consistency check is applied, and a candidate gap list is collated.
3. **Gap resolution and decision.** The targeted folder search is performed, each gap is classified, the workflow pauses at the second validator checkpoint, and the recommendation and report are produced.

## 5. Key components

1. **Ingestion and structuring.** The development document is parsed, split by section using template styles, and assessed for template version. Submissions prepared on the legacy template are mapped to the current section structure using a mapping table authored by the team and maintained as a controlled artifact.
2. **Section review agents.** One agent reviews each substantive section, with agents running in parallel. Sections that record sign-off or attestation rather than model content are excluded from review. Each returns a graded status for every requirement in its section, recorded as addressed, partially addressed, missing, or not applicable, together with the passage supporting that determination. Failures are retried; where retries are exhausted the section is recorded as unreviewed and raises an alert, and is never silently omitted.
3. **Cross-section consistency check.** Rules identify inconsistencies that no single section exhibits in isolation, such as metrics defined in one section but never reported in another, stated usage that conflicts with the monitoring description, or data descriptions inconsistent with the test samples presented.
4. **Targeted folder search.** A controlled second pass searches the documentation folder for evidence addressing each identified gap, so that requirements satisfied in supporting documents rather than in the template body are credited.
5. **Gap classification.** Each gap is classified by rule as a transparency gap, where the evidence exists but is not recorded in the MDD, or as a true gap, where the evidence is not present in the documentation set at all. The distinction matters because the two carry different consequences for the kick-off decision and for subsequent Finding severity.
6. **Validator review interface.** Gaps are presented with their supporting citations for confirmation or override, and overrides are captured with the validator's rationale.
7. **Decision and reporting.** Coverage is computed across applicable requirements after removal of those recorded as not applicable, weighted equally in the first release. A kick-off recommendation is produced where coverage exceeds the threshold and no requirement in the defined blocking set is recorded as a true gap. The tool produces an acceptance report, a gap list suitable for issue to the model owner, the arithmetic underlying the recommendation, and the full execution trace.
8. **Resubmission handling.** A revised MDD is reviewed on the same execution thread as the original, and each previously identified gap is reported as closed, open, or newly identified.
9. **Testing recommender.** Component 1.2 maps model type, risk tier, and key model characteristics to recommended testing areas, grounded in the requirements checklist and priority guidance.

## 6. Output

The tool produces requirement-level graded statuses with supporting citations, aggregated by section; a computed kick-off recommendation accompanied by the arithmetic that produced it, which the validator confirms or overrides with rationale; a gap list classified as transparency or true and formatted for issue to the model owner as a documentation request; and a complete execution trace supporting audit and examination review.

## 7. Success criteria

Performance is measured as the precision and recall of the tool's gap list against the labeled validator comments from the six historical models, reported by section with denominators stated. Targets are to be set, with particular attention to the recall threshold, given the consequence of an unidentified gap for the kick-off decision.

Consistency is assessed by confirming that the same submission produces the same assessment across runs and across validators. Efficiency is assessed against the effort currently required for manual acceptance review. Once the reference set is sufficient to support it, requirement weights and the coverage threshold will be calibrated so that documentation previously rejected scores below the threshold and documentation previously accepted scores above it.


### Conclusion

Validation reviewed the request form, the change EMA, the Model Developer's description of the resolution flow, the code, and the SME review results, and held weekly discussions with the Model Owner, Business Line, Model Developer, Model Risk Officer, Model Risk Governance, and Fair and Responsible Banking. The December 2025 Provisional Approval found the retrieve-and-rank design conceptually sound and its accepted outputs 85.4 percent precise on an SME review of 82 accepted matches. The LLM version keeps that design and the controls that approval relied on, and adds two language-model steps that are constrained to adding retrieval candidates and one similarity term. The SME review of the LLM version yielded [N] percent precision on [N] accepted resolutions from the pilot population, which meets the Business Line's expectation of [N] percent. Validation identified no concerns that would prevent proceeding with the pilot prior to completion of a full validation.

Consequently, Validation grants an Approved with Restriction (Time-bound) outcome, permitting pilot production use of the LLM version from 11/30/2026 to 5/30/2027 under the following restrictions. The restriction effective date is 5/30/2027.

- Time-bound: the pilot runs from 11/30/2026 to 5/30/2027, and the Initial Validation is to be completed by 5/30/2027.
- Scope-bound: use is limited to the ACH Originated and ACH Received payment rails, and accepted resolutions are used only to update the party summary provided to commercial bankers.
- Volume-bound: input is limited to 60,000 records per month selected by the Business Line from the consumer-filtered population, and accepted output to [N] records per month.
- Version-bound: the language models and their weights, the embedding model, the prompts, the confidence thresholds, the scoring weights, and the candidate count are fixed for the period, with only the immaterial prompt changes defined in the request form permitted, each logged and regression-tested before use; any other change requires model change management before use.

During the pilot, the Model Owner is expected to perform the monthly SME review of 200 accepted resolutions per ACH rail and to retain the review records and the record-level model outputs (the input, the candidates from both retrieval passes, the inferred sector, the scores, and the accepted result) for the Initial Validation. The December 2025 pilot's review records are not available, and the Initial Validation depends on this record.

The four recommendations of the December 2025 approval were not evidenced before the VectorDB version was paused and are carried forward for the LLM version.

- Conduct formal tests to provide evidence that the input scrub (the consumer filter, the Customer 360 scrub, and the name-restoration function, now including the transaction summaries sent to GPT-OSS-20B) and the Automated Acceptance Rules perform as described.
- As part of the monthly monitoring, track the distribution of confidence scores within the accepted population and the thresholds required to meet the accepted volume, to detect model or data drift as the industry term changes the score distribution.
- Maintain strict software and model versioning: the code, the configuration (candidate count, industry weight, score variant read by the acceptance rules, Mistral weights and their source, GPT-OSS reasoning setting, observation window), and the prompts under version control, with the running version synchronized to the repository the results are produced from, so that every reported result maps to the configuration that produced it.
- Complete the model documentation for the Initial Validation to the GenAI and Agentic AI Model Development Template by the milestone date in the request form [TBD: date].

For the LLM components, Validation recommends the following for the pilot and the Initial Validation.

- Extend the regression test described in the form for embedding-model changes to prompt and language-model version changes, with the SME-reviewed sample as the acceptance basis.
- Record in the monthly SME review whether each accepted resolution came through the name-rewrite pass and whether it carried an industry term, and track monthly the share of inputs that trigger the rewrite and the share with sufficient transactions for industry inference, so that the contribution of each language-model step and any drift in it are visible.
- Assess the accuracy of the LLM-inferred three-digit NAICS codes on a sample of the 3.4 million S&P Global entities, using entities that already carry a vendor code as the reference.
- State the toll-gate decision criterion with its base before the toll-gate date: precision on accepted outputs against the Business Line's expectation, and the resolved-volume comparison with the stored procedures on the same records.
- Record the agreed definition of an immaterial prompt change in the change EMA's model change definition field, so that the form, the EMA, and the change log agree.

## PA Form Revisions (10/26 draft)

- Question 2 (production use date). The draft still shows a pilot starting 11/1/2026 and running three months. The BL will change it to the agreed period, 11/30/2026 to 5/30/2027. The MO will let MRG know the dates moved.
- Question 4 (risks and controls), monitoring bullet. The draft says the LLMs, the embedding model, and the methodology are fixed for the PA duration. The team discussed what counts as an immaterial prompt change during the pilot: typo corrections, wording made clearer (for example, splitting a combined line in the prompt's sector list into two lines), and added few-shot examples. Such a change is recorded in the change log before it is made, a regression test shows performance is unchanged, and the changes are evaluated together at the Initial Validation rather than through a further PA for each. The MD confirmed there is no plan to change any of the three LLM uses (the name search, the industry inference from transaction summaries, and the 3-digit NAICS inference from S&P industry fields). The BL will add the allowed immaterial changes to this bullet so that what can and cannot change is stated together.
- Question 4, controls. The consumer filter and the Customer 360 scrub, which the updated EMA describes as removing personal information before any record reaches the LLM steps, will be stated here as a risk mitigation. The MO said the scrub is applied upstream, in a separate effort, and covers ACH data. The monthly SME review of 200 accepted resolutions per ACH rail during the pilot will be added as its own bullet under results validation. The heading can be broadened to cover both.
- Question 4, pilot length and acceptance rate. "The 3-month pilot" becomes six months. The acceptance-rate sentence (400,000 out of 1.9 million a month) is the stored-procedure figure, and the Kensho wording no longer applies. The BL will restate the sentence for this model: about 60,000 records a month go through the model, with the expected accepted share stated approximately.
- Question 5 (milestones). The fragment is fixed. The three-month period stated here, as in Question 4, becomes the six-month period, 11/30/2026 to 5/30/2027.

## Where the material-change definition is recorded

- The MRO asked whether the material-versus-immaterial definition for prompt changes lives in the EMA or the PA form. Validation's answer: the agreed definition goes into the PA form, so that a change during the pilot does not need a materiality decision each time. The EMA carries a model-change-definition field, but it does not yet hold this definition. The finalized definition will also be carried in the validation report and in the full model development documentation, and it can change over time with changes logged.
- The MRO will discuss with MRG whether the EMA should record the agreed definition, possibly when MRG updates the EMA for the actual production date.


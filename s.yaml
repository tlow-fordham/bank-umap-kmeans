- Columns added and columns removed, by header.
- For every column present in both files: the number of cells whose value or formula changed. For the four SME columns list each changed cell with its sheet row, the content before and the content after, typed or formula.
- State whether the tabs other than SME Review are identical to the last run's.

U3. The six hand-entered columns.
- The profile and the normalization mapping from Section 4, by rail.

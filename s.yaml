## Overall Performance

In 2026 I completed seven validations on time, including the Provisional Approval of the bank's first medium-risk agentic AI application in pilot production, which then passed internal audit with no issues or observations, and my first Initial Validation of the year. I caught three model changes made or planned without approval and routed each to the right review, and my own analysis decided the outcomes: on Model-7306 the material combined-answer change went to MRG and the Model Risk Committee, the model owner's regrade was shown to come from moving answers out of the denominator, and a code defect that bypassed the model's hallucination check was found and fixed during the review; on Model-7468 the published metrics did not reconcile to their own data, and my review of all 172 selling points became the evidence. The automation work I co-lead with Zhiguang became an enterprise program sponsored by Bob, and my Lumenova testing produced measurable platform improvements and a standing MRM role on the first line's evaluation platform. I also took on more people development, with Aditi moving into a primary validator role and two new offshore analysts mentored on live work.

Goals not met or changed:

- Performance Testing workshop: moved to Q1 2027 by Xinyu.
- Agentic AI Framework Evaluation white paper (Q4 2026): rescoped into the 2027 R&D topic, with the plan due 11/15.
- SME alignment and prompt optimization white papers: set aside per the midyear direction to prioritize one topic.
- Nimbus Phase II: not started, because the environment and subscription were not ready, the vendor had no GenAI feature ready to test, and the first line has since reported GenAI out of scope for the Nimbus UAT.
- TrustWise, ML Studio and Modeva: not evaluated hands-on in 2026.
- Codebase V2 and the Playbook V2: suspended when Bob redirected the build to an enterprise program on 09/04.
- Model-7306 and Model-7158 Initial Validations: no longer needed as planned; Model-7306 was retired and Model-7158 moved to a second Provisional Approval on the LLM version.

The strengths I relied on most were independent challenge grounded in my own analysis, and the working relationships that let that challenge land: with model owners, with MRG on Model-7306, Model-7468 and Model-7158, with the AI CoE through Saima, Jim Howard and Prashant, and with Bob on the automation program. The Model-7306 model development team told Xinyu and me in July that they were impressed by the depth of the review and expected future models to go more smoothly, and Saima named me among the contributors when the risk-tiered guardrail templates launched. I hold a position when the evidence supports it, as with registering our automation work with RM&C, which Xinyu first questioned and later credited, and I take direction when it improves the work: I rebuilt the Model-7468 rationale on Xinyu's feedback so the restriction rested on the control gap, and I cut the Model-7409 Special Purpose Validation to the extension justification alone at her review, after which Bob approved it for sign-off the next day. My development area remains concise, executive-ready writing. I have made progress, and Bob's only comment on the MVP1 plan was its timeline. My drafts still carry more evaluation detail than some document types need, so I am applying Xinyu's standard of matching a document's depth to its review pathway. In 2027 I plan to deliver the agentic AI evaluation research and the training and workshop it feeds, drive the automation program's first release with Zhiguang, complete the Model-7158 and Model-7637 Provisional Approvals and the Model-7409 Initial Validation by 06/09/2027, and bring Aditi and the offshore analysts to the point where they run Provisional Approvals with review rather than direction.


- Every row where the two disagree: sheet row, the raw content of both cells, and typed or formula for each.

V8. The versions compared on the records where they differ, by rail and in total.
- From column A's mapping: LLM correct and VectorDB incorrect; both correct; VectorDB correct and LLM incorrect; neither; unclear; column A empty.

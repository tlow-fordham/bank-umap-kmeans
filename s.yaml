# Provisional Approval Report (PA3) - Model-7306 PayVIEW - GTM and MMP ChatBot

Draft, 08/20/2026. Internal Validation draft. Not for distribution.
Recommended outcome: Approved with Restriction. Pilot duration: 05/04/2026 through 11/01/2026 (unchanged). Restriction effective date: 11/01/2026 (unchanged).

This report is scoped to a single change, the foundation large language model version upgrade from GPT-4o to GPT-5.1. It follows the structure of the second Provisional Approval (PA2) report and does not re-document unchanged elements; refer to the PA1 and PA2 reports.

---

## Executive Summary

This report documents Model Risk Management (MRM) Validation's third Provisional Approval (PA3) review of Model-7306, PayVIEW - GTM and MMP ChatBot. It covers one change: the upgrade of the foundation large language model from GPT-4o to GPT-5.1. The upgrade is driven by the vendor's retirement of GPT-4o, announced for October 2026, with GPT-5.1 as the bank platform's designated replacement; the bank's gateway migration for this model is scheduled for 09/18/2026, after which GPT-4o is no longer available to the model. The system prompt, retrieval process, embedding models, knowledge base, combined answer generation, business purpose, and user population are unchanged.

The second Provisional Approval covered the model on the GPT-4o configuration; the version upgrade therefore requires a new Provisional Approval before deployment. The business line performed comparative performance testing of the GPT-4o and GPT-5.1 configurations on the same test query set. [TBD: one-sentence summary of the testing result, e.g., correctness on the GPT-5.1 configuration of X percent against Y percent on GPT-4o, meeting the 67 percent pilot threshold.] Validation reviewed the testing and [TBD: has no concerns / observations]. Validation recommends an Approved with Restriction outcome for the change, under the same restrictions and dates as the existing approval, which are unchanged.

## Model Purpose and Usage

The model assists sales agents in answering Global Treasury Management (GTM) and Money Movement Platform (MMP) questions using the bank's knowledge base articles. It is employee facing, and agents review the model's output before relaying information to a customer. The model purpose and usage are unchanged; refer to the PA1 report.

## Model Theory and Construction

The change replaces the foundation large language model, GPT-4o, with GPT-5.1, accessed through the bank's GenAI gateway. This is a version upgrade within the same model family. The change is required rather than discretionary: the vendor is retiring GPT-4o in October 2026, and the bank's gateway migration for this model is scheduled for 09/18/2026. No other component changes. The system prompt and instruction for the combined answer generation, the retrieval and per-article answer generation process, the reflexion (Verbal Reinforcement Learning) grading step, the embedding models, the knowledge base, and the caches are unchanged from the configuration approved under the PA2.

Because the model's outputs are prose rather than numerical, the evaluation relies on subject matter expert grading and automated LLM-based metrics on the same test set, rather than an exact output-for-output comparison.

On 08/17/2026, the model was briefly switched to GPT-5.1 in production due to a miscommunication on the business and technology side, without performance testing or MRM approval, and was reverted to GPT-4o the same day after MRM raised the issue. The model development team represented that no end-user queries were served during the window. [TBD: written confirmation from the business line.] The event was reported to Model Risk Governance, and this Provisional Approval is the required approval path for the change.


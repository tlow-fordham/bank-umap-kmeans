## 2. Background

- Model-7158 Entity Name Resolution as a Service (ENRaaS) at U.S. Bank takes the counterparty name on an ACH record and resolves it to a company in two reference sources, S&P Global and Dun & Bradstreet (D&B).
- The workbook compares three approaches on the same records. The stored procedures are rule-based SQL in production today. The VectorDB version is the first model version, which is being retired. The LLM version is the new version under Provisional Approval review; it adds LLM steps, including a rewrite of the input name.
- There are two rails: ACH Originated and ACH Received. The column `llm_sor` carries the rail. Report every statistic by rail. A pooled figure alone is not usable.
- The records are data set 9, loaded 10/10/2026: 32,832 ACH Originated and 105,361 ACH Received, 138,193 in total.
- Each model version returns a candidate match and a score. Automated Acceptance Rules then mark the match "Accepted" or leave it NULL. Accepted means a rule passed. It does not mean the match is correct.
- Validation needs correctness of accepted matches as judged by a subject matter expert (SME), per rail. The model owner sent this workbook on 11/13/2026 as the completed SME review. In the photographed part, the SME Review tab shows the automated acceptance on every row (reviewer id "trusted-service-user", one rule comment) and no human judgment. Validation has asked the model owner to add the SME's call (correct, incorrect, cannot determine) as a column for each version's result, plus the reviewer's name. That column may or may not be there when you open the file.
- The model owner's explanation for the stored procedures' high rate on ACH Originated is that they can look up the U.S. Bank party behind the account number, which neither model version does. Validation asked for those lookup records to be separated, and the model owner said they are hard to isolate. Several tests below try to isolate them from the fields in the tab.

## 3. Rules for the work

- Read only. The workbook is evidence. Do not edit, sort, filter, recolour, or save it. If you need formulas, work on a copy. Leave Sheet1 alone; it is Jordan's own paste of the header and first 13 rows, and it is not data.

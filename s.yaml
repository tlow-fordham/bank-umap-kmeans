## PA Form Revisions

- Question 1 (the method and its use). The answers on the payment rails and the VectorDB challenger are now in the comment pane. The BL will write them into the body here. The same box says the entity database is updated weekly, while the data paragraph says the source tables are refreshed three to four times a year. The MO will replace both with one statement of the refresh the team can meet (see Reference Data below).
- Question 4 (risks and controls while the PA is in effect), monitoring bullet. The team discussed that immaterial prompt changes, such as typo corrections, small wording changes, and added few-shot examples, may be made during the pilot. This is provided a pre-defined regression test shows the model still has acceptable performance. The LLMs, the embedding model, and the methodology are fixed for the PA duration. The BL and the MD will review the bullet and update it to match this view.
- Question 4, acceptance-rate bullet. The struck-through figure of 42,000 out of 207,000 related to Kensho, which is no longer in use, and the BL is not sure it is correct. The BL will restate the sentence with the stored-procedure figure.
- Question 4, controls. Two controls are in the updated EMA but not yet in the form: the consumer filter and the Customer 360 scrub that run before the LLM steps, and the monthly SME review of 200 accepted resolutions per ACH rail. This version of the PA form has no separate question on LLM controls and personal information, so both go here. The BL noted that the manual review is already described in this box.
- Question 4, LLM-specific risks. The MD said in writing earlier that the inferred NAICS labels were not separately assessed for accuracy and are used as one similarity signal within the confidence score. The team agreed the form will say the same.
- Question 5 (milestones). The sentence on a shortfall in accuracy contains a fragment that does not belong in it ("the ENRaaS LLM is superior to the ENRaaS VectorDB version, that will be replaced, and"). The BL will delete or move the fragment. The sentence will then read that, if there is a shortfall in accuracy, the BL will continue to enhance the LLM version until it can replace the stored procedures. The BL will also adjust the milestone dates to 11/30/2026 to 5/30/2027.


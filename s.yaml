- The MO asked whether the 11/2/2026 date for the SME results has a day or two of flexibility. The date was confirmed as Monday 11/2/2026, and the MO will work to it. Validation's secondary will work with the MO on the results while the lead is on leave.

## Answers to the Two Written Questions

- Resolved identifier. The S&P Global identifier is the primary output. The input is matched to the D&B reference data and to the S&P Global reference data independently; there is no comparison between the two, and a higher D&B score does not change the S&P Global result. The MD understands the business line's assessment of outcomes to look at the S&P Global result only. Validation will evaluate both results when it reviews the SME sample, so the sample should show the D&B result alongside the S&P Global result.
- Non-U.S. counterparties. The MD stated that the inputs include a country field, but the ACH records are U.S. transactions and the counterparties are treated as U.S. entities.

## Personal Information in the Transaction Summaries

- The transaction summaries sent to GPT-OSS carry the counterparty names, the transaction descriptions, and the transaction frequencies. The MD's position is that ACH transaction data carries no personal information and that the summaries contain only business names and transaction usage; the MO said the data is scrubbed upstream. This is recorded as an assumption of the model and will be stated as such in the form.

## Code Corrections

- The sector-code range mapping (31-33, 44-45, 48-49) did not require a code change. The MD added the individual two-digit codes to the lookup dictionary in data preparation, so each prefix maps to its sector. Validation will record it as fixed.
- Single-candidate scoring. The vector search returns at least 20 candidates for every record, so the case of a single candidate does not arise.


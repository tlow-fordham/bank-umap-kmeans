
# MVP1 Documentation Acceptance Tool - Project Plan

Prepared by the Artificial Intelligence and Machine Learning Validation Center of Excellence, Model Risk Management (MRM). Draft for review, August 2026.

---

## 1. Purpose

Every generative artificial intelligence (GenAI) validation begins with a documentation acceptance decision. A validator reads the Model Development Document (MDD) submitted by the model owner, assesses whether it is sufficiently complete to support a validation, and determines whether the engagement can be kicked off. That assessment is performed manually for each submission and applies a threshold that is not written down, so the outcome varies with the reviewing validator and model owners receive inconsistent signals about what the documentation must contain.

MVP1 automates that assessment. The tool reviews the submitted documentation against the GenAI requirements, identifies gaps by category, and produces graded requirement-level assessments from which a kick-off recommendation is computed. A validator confirms the recommendation before it is acted on.

The users of the tool are validators. The acceptance report may be provided to the model owner after the validator has reviewed it, so the model owner receives a consistent statement of what the documentation requires with Validation retaining review responsibility. The output is a working artifact supporting the kick-off decision and does not form part of the validation record.

The approach is also intended to serve as a template for other MRM validation teams, and design decisions have accordingly been made to generalize beyond GenAI models.

## 2. Scope

Component 1.1, the documentation acceptance review, is delivered for the chatbot and document intelligence archetypes by 11/30/2026. It identifies documentation gaps across data, methodology and framework, and performance, classifies each gap, and supports the kick-off decision. Component 1.2, the validation approach and testing recommender, recommends the validation approach and testing areas from model type, risk tier, and key model characteristics. It is not part of the 11/30 deliverable, and its timing will be set separately.

The following are outside the scope of MVP1:

- The agentic artificial intelligence archetype. No agentic development documentation exists against which the tool could be built or tested, and the archetype will be added once such documentation is available.
- Monitoring plans and implementation testing plans as reviewed inputs. These may be added if the effort permits.
- Drafting of validation report content, which is the subject of MVP2.
- Execution of model testing, which is the subject of the evaluation codebase workstream.
- Orchestration of the end-to-end validation workflow, which is the subject of MVP3.
- Review of the Estimation Method Questionnaire (EMQ) and the Estimation Method Assessment (EMA). Point-in-time versions of these records cannot be reconstructed from Archer, so the tool cannot assess them as they stood at kick-off. A future enhancement may compare the EMA against the development documentation to support the corresponding validation report section.

## 3. Input data

The review standard consists of the GenAI and Agentic AI Model Development Template, whose section-level instructions and questions are embedded in the tool as the criteria against which documentation is assessed; the GenAI requirements checklist and its priority guidance; and the legacy Model Development Template, which supports the section mapping applied to submissions prepared before the GenAI template was issued.

The reviewed input for the 11/30 deliverable is the MDD in Word format, which is the document and the format in which development documentation is submitted. Broader input formats and document types are addressed in later phases. The path to the model documentation folder is supplied at the start of a run, and supporting documents and meeting minutes within that folder are consulted only in the targeted second pass described in Section 4, where they serve to resolve identified gaps.

Ground truth for development and measurement is drawn from the six GenAI models that have completed full validation. Earlier MDD versions carrying validator comments are available for these models and are being assembled into per-model folders containing all document versions, the associated meeting minutes, and both templates. Word comments are structured data within the document file and can therefore be extracted programmatically together with the section to which each is anchored. A subject matter expert pass separates substantive gap comments from editorial ones, producing a section-level reference gap set for each model. Model-6788 was documented on the legacy template and serves as the test case for section mapping. Constructed examples supplement the historical set.

## 4. Framework and architecture

The tool is built in LangGraph with Azure OpenAI accessed through the Application Programming Interface Management (APIM) gateway. The graph structure holds control of execution, which means each requirement check is guaranteed to run rather than left to model discretion, every step is checkpointed, and the resulting trace supports internal audit and regulatory examination review. The section review agents and the evaluation harness use the most capable GPT and Claude models available on the gateway, which additionally permits a two-judge cross-check during measurement.

The tool is not a retrieval-augmented application. Retrieval addresses the problem of locating relevant material within a corpus too large to present at once, which is the situation when a model answers open questions against a knowledge base of many thousands of articles. The documentation acceptance problem has the opposite shape. The questions are fixed and known in advance, being the template requirements themselves, and the material to be searched is a single document of known structure. Current-generation models available on the gateway accept context windows substantially in excess of the length of a model development document, so each section can be presented to its reviewing agent in full rather than as retrieved fragments.

Chunking would additionally work against the purpose of the tool. A requirement is frequently evidenced across a narrative passage, an accompanying table, and a cross-reference to an appendix, and dividing the document into fragments severs those relationships. More fundamentally, retrieval can establish that a requirement has been addressed but cannot establish that it is absent, since material not returned by a similarity search may nonetheless be present in the document. Because the central function of the tool is to determine that a requirement has not been addressed, it must assess the complete section rather than a retrieved subset.

Each substantive section is accordingly reviewed by a dedicated agent whose system prompt carries that section's template instructions, its requirement list, and the archetype-specific rules governing which requirements do not apply. A chatbot, for example, invokes no tools, so tool inventory requirements are recorded as not applicable rather than as gaps.

Two validator checkpoints are built into the workflow. The first occurs before review, where the validator confirms the archetype, the template version, and the section split, since an error in those inputs would propagate through every subsequent check. The second occurs after the gap list is produced, where the validator may cite meeting minutes or supporting documents as evidence that an apparent gap is addressed elsewhere. Any such claim is verified by the tool, which reads the cited source and confirms or rejects the remediation before a gap is reclassified. The kick-off recommendation itself is computed from the graded requirement statuses by a deterministic rule and is not generated by a language model.


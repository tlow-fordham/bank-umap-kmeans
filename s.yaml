## Section 4.3 (new) - Release Schedule and Resourcing Beyond Release 1

The program is delivered as a sequence of releases on the shared foundation described in Section 4.1. Release 1 is the commitment; the sequence of subsequent releases is the plan of record and may be re-ordered on impact, process readiness and dependency without changing the Release 1 commitment. Each release carries its own scope, dependencies and resource requirement so that funding can be evaluated per release as well as in total.

| Release | Target completion | Scope | Key dependencies | External resources | Internal resources |
|---|---|---|---|---|---|
| Release 1 | 03/31/2027 | Development documentation support for model developers; documentation acceptance review; validation support for full validations, initial validations and provisional approvals, including evidence review, report drafting and finding drafting | Reference corpus and labeled reference sets; structured development template; MRG classification of the tooling; BCIQ and PRISM review; enterprise gateway access | Team per Section 5.2 | Program management, MRM subject matter experts, Model Development counterpart, MRG counterpart per Section 5.1a |
| Release 2 | 06/30/2027 | Change management review (targeted scope validation) and annual review workflows, reusing the Release 1 review, evidence and drafting components | Streamlined model change management pathways released 09/2026; annual review templates; Release 1 production stability | [INPUT: count and mix] | [INPUT] |
| Release 3 | 09/30/2027 | Monitoring plan and implementation plan support; monitoring result interpretation, trend and exception analysis; monitoring report drafting and MRM review support | Revised Monitoring Plan and Implementation templates; monitoring data access | [INPUT] | [INPUT] |
| Release 4 | 12/31/2027 | Issue and finding management; MRG process automation per Section 2 | MRG requirements; Archer integration feasibility and access | [INPUT] | [INPUT] |

Detailed functional design is staged by release. The Release 1 functional and technical design is completed jointly with the contractor once funding and onboarding are in place, per Section 4.2. Design planning for Release 2 begins in 03/2027, in parallel with Release 1 hardening, so that the contractor team moves from one release to the next without an idle period. Each subsequent release follows the same pattern.

Resource requirements are stated per release so that the funding request distinguishes the Release 1 build from the continuing capacity required for expansion. Where the external team size is expected to remain constant across releases, that is stated; where a release requires a different mix, for example integration-heavy work in Release 4, the difference is stated with its rationale. [INPUT: per-release resource estimates.]

## Section 5.1a (new) - Internal Roles and Involvement

The engagement is a co-delivery rather than a hand-off. Internal teams remain engaged throughout design, build, testing and release, and the following roles are required for the duration of the program.

- **Program management (MRM):** Two named leads, Zhiguang and Jordan, at approximately one full-time equivalent combined through delivery, covering requirements ownership, contractor selection and onboarding, design review and sign-off, backlog and sprint participation, acceptance testing coordination and stakeholder communication.
- **MRM subject matter experts:** Definition and maintenance of review criteria, documentation requirements and acceptance thresholds; labeling of reference data; acceptance testing of delivered capabilities against the reference sets; user feedback during pilot use. Estimated at [INPUT] hours per week during Release 1, drawn from the AI Validation team.
- **Model Development counterpart (AI Center of Excellence):** A named assignee who owns requirements, acceptance and adoption for the development documentation workflow and represents model developer users.
- **MRG counterpart:** A named contact for the classification determination of the tooling, MRG process automation requirements and template alignment.
- **Technology:** Environment provisioning, access administration and integration support during the build, and the ongoing platform owner described in Section 9.

The working model consists of standing standups with the contractor team, a shared backlog, design reviews at each phase gate in Section 4.2, and internal acceptance sign-off before any capability is released to business use. Contractors bring engineering capacity and delivery expertise; internal teams bring the standard the capability must meet and confirm that it meets it.

## Section 5.2 addition - External Team Composition

The external team for Release 1 is expected to comprise three to five practitioners in the following mix:

- three data scientists or data engineers with hands-on GenAI and agentic workflow experience, responsible for the review, evidence, drafting and evaluation components;
- one integration engineer responsible for enterprise platform integration, security controls, observability and deployment; and
- one delivery lead or project manager with model risk or financial services experience, responsible for translating validation requirements into engineering scope and for release management.

Senior practitioners are preferred. Junior staff without financial services or risk experience increase the knowledge transfer burden on internal subject matter experts and raise the effective headcount required to deliver the same scope. The team size for subsequent releases is stated in Section 4.3, and the composition above is the starting position for negotiation rather than a fixed requirement.


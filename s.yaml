## Mechanics

Load the docx skill if this session has one (`anthropic-skills:docx`) and follow its tracked-changes and comments workflow. The steps it gives:

1. Unpack the .docx, delete symlink entries, run `merge_runs.py` on the unpacked folder so phrases are findable as contiguous text.
2. Make every text edit in `word/document.xml` as a tracked change. Wrap inserted runs in `<w:ins>` and deleted runs in `<w:del>`, each with `w:id`, `w:author="Jordan Low"` and `w:date` (today, ISO 8601, for example `2026-10-30T09:00:00Z`). Deleted text uses `<w:delText>`, not `<w:t>`. A deleted paragraph mark is `<w:del/>` inside `<w:pPr><w:rPr>`, placed before the rPr's other children.
3. Add comments and replies with `comment.py` in directory mode: `python scripts/comment.py unpacked/ "<text>" --author "Jordan Low" --initials "JL"` for a new comment, and add `--parent <id>` for a reply under an existing comment. For a new comment, paste the printed `commentRangeStart`, `commentRangeEnd` and `commentReference` markers into `document.xml` around the anchor text; without them the comment exists but is not shown.
4. Rezip and validate: `python scripts/office/validate.py out.docx --original <base>.docx --author "Jordan Low"`. The author flag reports any text changed without a tracked-change wrapper. Fix every report before finishing.

Without the skill, the same OOXML rules apply; the six comment files (`comments.xml`, `commentsExtended.xml`, `commentsIds.xml`, `commentsExtensible.xml`, the relationships entry and the content-type override) must stay cross-linked, and a reply is a comment whose `commentsExtended.xml` entry names the parent's `paraId`.


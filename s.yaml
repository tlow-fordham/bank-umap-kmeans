## What is needed

The first run answered the handoff and its numbers tie. This annex asks only for what that run did not print and for what its results raised. Write one new file with the items below and nothing that is already in the results file or the row lists.

Name: YYYYMMDD_Model-7158_enraas_perf2_SME_Calls_LLM_Output_Delta.md. Aim for 80 lines or fewer, so it carries across whole.

Same rules as before: read only; workbook is the source; rates carry numerator and denominator; by rail; rows by sheet row number; the same masking the results file used. Extend 20261116_sme_calls_analysis.py and keep the script out of the file.


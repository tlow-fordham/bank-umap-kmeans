## Reference Data and the Comparison Data Set

- The S&P Global and D&B reference data are not refreshed weekly in practice. The MO said the team tries to refresh the two source tables weekly but often cannot, because of source issues and the platform moves from Greenplum to Azure and now Databricks. The actual cadence falls between the weekly statement in Question 1 and the three to four times a year stated in the data paragraph. The MO will replace both with one statement the team can meet. The PA does not require a particular refresh schedule; the form has to describe what is done.
- The two copies of the S&P Global data have drifted apart: the vector database was built from a July 2026 table and the entity database from an August 2026 table. Data sets 6, 7, and 8, run through the acceptance procedure, gave a poor outcome, and the BL attributes this to the mismatch. The MD will update the S&P Global data in the vector database, and the BL will rerun data sets 6, 7, and 8 to see whether results improve. If they do not, the BL will build a new data set and run it through the vector search and the LLM version. The BL and the MD will compare record counts between the two versions of the table.
- The 10/22/2026 date for the reference-data update was the first step in the plan. It can move as long as the SME review and comparisons arrive by 11/2/2026. The BL said the work is on track for 11/2/2026. The MO confirmed the plan for 11/2/2026: update the reference table, run the vector search and the LLM version, and complete the SME review.

## SME Review

- The MO will perform the review. The sample will be stratified by rail (ACH Originated and ACH Received) and by stored-procedure outcome, as agreed on 10/14/2026. The comparison will cover the stored procedures, the vector search, and the LLM version. The MO estimates about 700 to 1,000 names, checking 10 to 12 fields per record, and considers this manageable. Results are due 11/2/2026.

## Configuration Table

- The pilot configuration is to be provided in one table, including the GPT-OSS reasoning setting, with the code version on which the SME results are produced. The code package shared earlier is not the running version. Due with the SME review by 11/2/2026.

## Automated Acceptance Rules

- The MO said the Automated Acceptance Rules have not changed since the December 2025 pilot. They are four or five fuzzy-matching rules, the same process the BL used with Kensho, which check the returned entity against the original record. They are separate from the comparison run, which checked whether the S&P Global identifier from the LLM version matched the identifier from the stored procedure. The MO noted that fuzzy matching is not entirely black and white and that the rules have to be considered when evaluating the results.


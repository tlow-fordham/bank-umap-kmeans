### Purpose of Business Change

This is the Description that 1LOD holds since the 10/30/2026 corrections. One phrase differs: the record is named as the 1LOD risk record, so the sentence reads clearly on this form.

Paste:

The initiative provides task-automation and analytical tools that support Model Risk Management validation analysts in performing second-line validation of generative AI and agentic AI models. The validation process remains analyst-led: MRM validators perform the analysis and reviews, evaluate tool-generated outputs, exercise professional judgment, and make all validation conclusions and decisions. The current capability (Phase 1) is a Python toolkit used by the MRM AI validation team on GenAI model validations to assist with LLM-as-a-judge scoring of model responses (query, response, and retrieved context) against defined metrics, topic modeling of text such as knowledge base articles and test queries, and synthetic test data generation. These capabilities automate or assist with discrete tasks within the analyst's workflow, not the validation itself. Every output is reviewed and assessed by a validator before it is relied upon. The toolkit runs in the IT development environment and calls Azure OpenAI through the enterprise API gateway: GPT-5.1, plus the text-embedding-ada-002 embedding model for topic modeling. Development environment access is renewed every three months. Validators run the tools as local desktop applications and notebooks, and in the current phase the outputs stay within MRM. The planned next phase, for which requirements are being defined, adds further task support for the analyst: a completeness check of submitted model development documentation against MRM's documentation requirements, with the validator reviewing the result and sending the documentation feedback to the model developer; suggested validation activities and tests for the validator to consider when planning a validation; and first drafts of validation report sections for the validator to revise, with the validator writing all conclusions, Findings, and outcomes. Each of these is reviewed and acted on by the validator before anything leaves MRM. The end product in every case is a validation report that goes through validator, manager, and executive review and peer review before it is uploaded to Archer, a cycle that runs over days rather than hours, so each AI-assisted output is checked more than once before it is relied upon. The build approach (internal, contractor, or vendor) and platform are being determined; the first release is targeted for 03/31/2027, subject to that decision, and the 1LOD risk record will be reassessed before that release, as the risk guidance requires. Technologies are Python and Azure OpenAI (GPT-5.1 and text-embedding-ada-002) through the enterprise API gateway.

Short version, only if the field cuts the text off:

The change provides task-automation and analytical tools that support Model Risk Management (MRM) validation analysts in second-line validation of generative AI and agentic AI models. The current capability is a Python toolkit, run in the IT development environment through the enterprise API gateway to Azure OpenAI, that assists with scoring model responses against defined metrics, topic modeling of text, and synthetic test data generation. The planned next phase adds a completeness check of model development documentation, suggested validation activities, and first drafts of validation report sections. The validator reviews every output and makes all validation conclusions and decisions. The first release of the next phase is targeted for 03/31/2027.


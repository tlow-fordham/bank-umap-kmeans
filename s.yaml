## Risk Mitigation

The risk mitigations from the existing approval remain in effect and are unchanged: employee facing use with agent review before any customer relay, a limited group of trained and experienced agents, a curated set of pre approved knowledge base articles that contain no customer data with source links preserved, and access through the bank's GenAI gateway providing authentication, logging, content filtering, profanity filtering, and prompt injection controls. The gateway controls apply to GPT-5.1 in the same manner as GPT-4o. The reflexion grading step and the combined answer exclusion of unanswered articles, corrected during the PA2, are unchanged by the version upgrade. [TBD: confirm with the model development team that the corrected combined answer code operates identically on GPT-5.1 outputs.]


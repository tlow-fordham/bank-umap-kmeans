## 9. Resourcing

The initiative is resourced at 14 hours per week per team member through 11/30/2026 and is the team's priority initiative for the period, with validation engagements planned around it. Additional internal resource and external support are available where required. A learning session is being arranged with an external firm that has developed a comparable documentation acceptance capability. The role split across the team is to be confirmed.

## 10. Dependencies and risks

Methodology definition, the section mapping table, prompt development, and reference set assembly proceed in September in parallel with the platform build, so that only integration depends on the platform foundation being available at the end of that month.

The reference gap sets are the measurement basis for the 11/30 deliverable, which places folder assembly and comment extraction on the critical path. Four validation engagements fall within the MVP1 window against an open position on the team, and resourcing is monitored against that load through the period. Requirements satisfied through supporting documents rather than the template body are credited through the folder search pass, and requirements satisfied nowhere are recorded as true gaps. The boundary with MVP2 is maintained, since gap review output resembles validation report content.

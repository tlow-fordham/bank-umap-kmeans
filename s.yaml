EMA 68556408, proposed changes (Paramjit, with Damien)

1. Pilot Decision Details, first sentence.
Before: "During testing the LOB saw matched results on ACH-Received averaging 17% which was marginally above the StorProc returns, however with the high volume of data this becomes meaningful."
After: "On the 10/10/2026 production load of 138,193 ACH records, the acceptance rules accepted the LLM version's result on 1,071 of 32,832 ACH Originated records (3.3 percent) and on 6,526 of 105,361 ACH Received records (6.2 percent)."

2. Pilot Decision Details, second sentence.
Before: "The pilot will be able to assess if the matched returns are persistent over a 3-4 month period and also incorporate ACH-Originated assessment."
After: "The purpose of the pilot is to determine on which segments of ACH records the LLM version improves on the stored procedures and could replace them, and on which segments the stored procedures remain the better method, for example settlement payments. Records are selected by resolution source, both methods run on the same records in production, and the two results are held in separate tables and compared."

3. Pilot Details, the pilot period.
Before: "(11/30/2026 to 5/30/2027)"
After: "(12/14/2026 to 6/15/2027)"

4. Pilot Milestone Details, the dates.
Before: "PA review October to November 2026; production use on the ACH rails from 11/30/2026; Monthly SME review through the period; full validation complete by 5/30/2027."
After: "PA review October to December 2026; production use on the ACH rails from 12/14/2026; Monthly SME review through the period; full validation complete by 6/15/2027."

5. AI / ML Model Structure / Nature, second paragraph.
Before: "The LLM component is used to infer industry classification information for unresolved entities. Specifically, the model analyzes aggregated payment transaction activity associated with an entity over a defined observation period and predicts a likely North American Industry Classification System (NAICS) industry group. The inferred NAICS classification is not used as a standalone matching decision. Instead, it serves as an additional feature within the entity resolution framework and is combined with other similarity signals to improve candidate ranking and match selection. The final entity resolution outcome is determined through the integration of multiple matching signals, including business name similarity, reference data attributes, and the LLM-derived industry classification."
After: "The LLM component, GPT-OSS-20B, is used in three steps. Where the initial confidence score is below 0.8, it rewrites the input business name to a likely official name for a second candidate-retrieval pass. For entities with at least ten ACH transactions in the observation period, it infers a two-digit North American Industry Classification System (NAICS) sector from a summary of payment activity, which serves as one similarity signal in candidate ranking. Offline, it infers a three-digit NAICS code for S&P Global reference entities whose code cannot be taken from the Dun & Bradstreet cross-reference or the S&P Global industry fields. The existing scoring and the acceptance rules determine the match."

PA request form, proposed changes (Guru and Bill, with Wentao on items 3 and 4)

1. Question 3, first sentence (purpose of the pilot).
Before: "Provisional approval is required to test the performance of LLM Model results against the Internal Stored Procedure based Entity Resolution results and Vector DB results for the ACH payments rail."
After: "Provisional approval is requested to run the LLM version of ENRaaS in production, in parallel with the existing stored procedures, on the ACH Originated and ACH Received payment rails. The purpose of the pilot is to determine on which segments of ACH records the LLM version improves on the stored procedures and could replace them, and on which segments the stored procedures remain the better method, for example settlement payments. The stored procedures resolve records through several techniques, which the resolution source field identifies. Some of those techniques use account or customer information, and the LLM version works from the name on the record. During the pilot, records are selected by resolution source, both methods run on the same records, and the two results are held in separate tables and compared."

2. Question 1, pilot volume, to match the Pilot Scale Detail in EMA 68556408.
Before: "The most business-critical subset, consisting of approximately one day's of "originated" and "received" resolved/ unresolved business names per week (~200,000 records), is submitted to ENRaaS for enhanced entity resolution."
After: "A subset of up to 60,000 records per month in total across the ACH Originated and ACH Received rails, including records the stored procedures resolve and records they do not, is submitted to ENRaaS for enhanced entity resolution."

3. Question 1, language model name, in the flowchart box, later in the paragraph below the flowchart, and in item 3 of the inputs list.
Before: "Mistral-7B-Instruct-v0.3" and "Mistral"
After: "GPT-OSS-20B/v1"


- Do not judge whether a match is correct. The name tests below are mechanical screens and are to be labelled as screens.
- Report numbers and method. Keep interpretation to one line per test. Do not draft report narrative.
- Make routine choices yourself and record them. Stop and ask Jordan only if the file cannot be opened or the tabs described here do not exist.

Masking in the results file, which will be saved in a repository with handling rules:

- Never write the digits of `llm_party_id`, `sp_party_id`, or `vdb_party_id`. They read as routing and account numbers. Refer to rows by sheet row number.
- Replace any run of six or more digits inside an input name with [digits].
- Where an input name reads as an individual's name, write the given name and any professional suffix, and replace the rest with [surname withheld].
- Write [another bank] in place of the name of any bank other than U.S. Bank or U.S. Bancorp, in inputs and in resolved entity names. If unsure whether a name is a bank, mask it.
- Cap every example list at 25 rows per rail unless a test says otherwise.


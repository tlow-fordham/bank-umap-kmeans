## 4. Rules for this run: derive everything from the workbook

Earlier counts went wrong because TRUE was typed as text in some cells and stored as a boolean in others. The columns in this file are free text entered by hand, so the script must discover what is there before it counts.

1. Columns. Find every column by its header text after trimming and case-folding, and print the header-to-letter map for the SME Review tab. If a header named in this handoff is missing, renamed or duplicated, print the closest headers found and say which one was used.
2. Rails. Take the rail from `llm_sor` on each row. Print the distinct `llm_sor` values and their counts.
3. Records. Take the record set from the rows that carry data, and print the first and last sheet row and the count. Report hidden rows, active filters, merged cells, totals rows and any row below the data.
4. Profile before counting. For each hand-entered column (the two new columns and the four SME columns), print every distinct raw content with its count and its stored type: boolean, number, text, formula, error or empty. For text, show the string between brackets with its length, so that leading or trailing spaces and case differences are visible.
5. Flag normalization. Build the mapping from the profile and print it as raw content, stored type, normalized value and count.
   - TRUE: a boolean true, or text that equals `true` after trimming and case-folding.
   - FALSE: a boolean false, or text that equals `false` after trimming and case-folding.
   - BLANK: an empty cell, an empty string, or text that equals `null` after trimming and case-folding.
   - OTHER: every remaining content, such as yes, no, Y, N, correct, a number, or an error. Keep OTHER as its own category in every count and list its sheet rows with the raw content. If an OTHER value plainly means correct or incorrect, say so beside it and leave it in OTHER.
6. Formula cells. Read each cell in formula mode and in cached-value mode. Evaluate the simple IF patterns yourself from the row's own values and report every cell where the cached value and your evaluation differ, or where no cached value exists. Use the value Excel displays, and state which source you used.
7. Category columns. For `LLM v Vector DB`, `LLM Correct Reason`, the two reason columns, `sp_duns_source` and `spg_match_review_code`, enumerate the distinct values found and build every cross-count from that enumeration. Group variants that differ only in case, spacing or punctuation, and print the variants under the group. Where this handoff names a group of values, apply it to the values found and give any value the handoff does not name its own line.
8. Meaning of column A. Print each distinct value of `LLM v Vector DB` and propose, for each, what it says about the LLM version's result (correct, incorrect, unclear) and about the VectorDB version's result (correct, incorrect, unclear). Print that mapping as a table so it can be checked. A value that fits neither reading goes to unclear, with its rows.
9. The id that the settlement formulas key on. Read it from the formula text in the workbook and report where it appears.
10. Ties. Under every count table print whether TRUE plus FALSE plus BLANK plus OTHER equals the records, and whether the rails sum to the total.


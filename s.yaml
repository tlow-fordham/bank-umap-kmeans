## Business Case

Paste:

MRM-AI Validation provides task-automation and analytical tools that support Model Risk Management (MRM) validation analysts in second-line validation of generative AI models. Validators otherwise review model responses one at a time against evaluation criteria, group test questions and knowledge base content by topic, and write test cases by hand. The toolkit assists with these tasks through LLM-as-a-judge scoring of model responses against defined metrics, topic modeling of text, and synthetic test data generation. The validation process remains analyst-led. A validator reviews every output before it is relied upon and makes all validation conclusions and decisions.

## Key Decision Criteria

Paste:

- Use of the bank's existing enterprise AI platform, with no new technology, vendor, or cloud resource.
- Model documentation is treated as confidential and is sent only to Azure OpenAI through the enterprise API gateway. The toolkit handles no personal data, PII, or PCI, and no production data.
- A validator reviews every output. The toolkit takes no automated action and has no integration with other systems.
- The solution stays within the development scope that 1LOD AI Risk approved (Risk ID 3123, Tier 2 - Moderate Risk).
- No new cost for the current capability.

## Decision Context / Background Information

Replace the bracketed ISS number before pasting.

Paste:

MRM-AI Validation is a Python toolkit that the MRM AI validation team, about ten validators, runs in the IT development environment as local desktop applications and notebooks. It calls Azure OpenAI (GPT-5.1 and the text-embedding-ada-002 embedding model) through the enterprise API gateway operated by AI CoE Support. Inputs are model development documentation, knowledge base content, and test or synthetic datasets, which are treated as confidential. The toolkit has no customer-facing use, no access from outside the bank network, and no connectors, and it exposes no APIs. Open-source Python libraries are used for clustering (scikit-learn, umap-learn, and hdbscan), and the DeepEval evaluation library is being tested for the next version.

Reference numbers: AI CoE intake 1286. 1LOD Risk ID 3123, rated Tier 2 - Moderate Risk, with this ADD review listed as a next step in the approval dated 11/06/2026. AI Registry AI0004803. CAR ID 11342 (APM0010562), component 11342.1 Open AI Dev Environment, in Development lifecycle status, with AI CoE Support as the recorded owner. ISS EngageUs request [ISS request number]. Corporate Functions Change Management Intake Item ID 2408.

A planned next phase adds a documentation completeness check, suggested validation activities, and first drafts of validation report sections, each reviewed by a validator. The build approach and platform for that phase are being determined, with a first release targeted for 03/31/2027. This request covers the toolkit as it runs today. A change of platform, vendor, connectors, or integrations in the next phase would be brought back for architecture review.


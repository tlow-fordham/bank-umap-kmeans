## LLM Version Architecture

- The vector database is retained in the LLM version. Jordan asked how the LLM and the vector database are combined. Per Wentao, the LLM is used for two purposes:
  - inferring the North American Industry Classification System (NAICS) industry classification for the entity
  - interpreting the input name and suggesting an alternative or normalized name, which is then used to run the vector search.
- On this description the LLM augments the existing retrieval and scoring flow rather than replacing it. The embedding model, vector search, Entity Database, confidence score calculation, and Automated Acceptance Rules are all retained, and the inferred NAICS classification is added as a further similarity measure within the existing confidence score.
- The draft form shared on screen names two locally hosted models, Mistral-7B-Instruct-v0.3 for the name interpretation pass and GPT-OSS-20B/v1 for the NAICS inference, running on NVIDIA DGX infrastructure. When each is invoked and what data feeds them was not discussed in detail and is tabled for the next meeting.

## Performance Evidence Presented

- Wentao and Bill stated the team has been running multiple datasets through the LLM version in the development environment.
- Guru shared the comparison spreadsheet and Bill walked through it. The objective of the model is, for a payment record such as an Automated Clearing House (ACH) payment, to identify the recipient and resolve it to an S&P Global identifier.
- The spreadsheet holds two kinds of sample set, each run separately for ACH originated and ACH received:
  - Samples of records that had already been resolved, either by the stored procedures or by Kensho, sent to the LLM to resolve. The metric is the share of records where the LLM returned the same S&P Global identifier as the existing resolution.
  - Full-day extracts for selected dates in May and June 2026, sent to the LLM without pre-selection. Bill explained this second design was added because the first drew only on records the legacy processes had already resolved, which he described as cherry-picking.
- For the full-day extracts, two metrics are shown for the same LLM outputs: the share matching the stored-procedure identifier, which the team struck through after Wentao raised that exact match against the stored-procedure result was not a fair scoring basis, and the share of LLM outputs accepted by the acceptance procedures (the Automated Acceptance Rules, 10 to 15 rules comparing the resolved entity's name, address, and phone number to the input record). Both figures come from a single LLM version and differ only in how the outputs were scored.
- Bill presented the accepted share on the full-day extracts as the basis for the proposal, and his position is that the pilot's purpose is to find whether there is a sweet spot, meaning record types or sources where the LLM excels, and whether performance can be improved further.
- The spreadsheet does not include results for the VectorDB version on the same records. Bill stated verbally that the December 2025 VectorDB pilot results were in line with the LLM results shown, and that the LLM looks better in this particular comparison.
- Aditi asked why the ACH originated and ACH received results on the sheet differ. Bill explained that ACH originated records are easier to resolve because the transaction originates from the bank's side.
- Validation will review the spreadsheet in detail once received, including the aggregate-by-date and quarterly views it contains, before drawing conclusions from the figures.

## Ground Truth and Evaluation Method

- Jordan described Validation's usual expectation for a comparison of this kind: a confusion-matrix view (true and false positives and negatives) of the stored-procedure and LLM outputs on the same records, showing both the LLM's lift and that it does not introduce additional errors.
- Wentao stated that the comparison has no ground truth. Bill's view is that the stored-procedure result serves as the reference for the same records; Wentao's view is that it is not ground truth. Bill confirmed the spreadsheet is a result-versus-result comparison rather than a confusion matrix.
- Jordan noted that the acceptance-procedure pass rate is an automated evaluation of the outputs rather than a measure of accuracy against confirmed matches. The evidence expected with the PA submission is set out below.
- Jordan asked that the spreadsheet be provided with the submission materials. The Kensho comparison is not needed in the PA narrative, since Kensho is discontinued and is not a challenger.

**Performance evidence required at the PA stage.** Following the meeting, and in answer to the action item below, Validation confirms the performance evidence expected with the submission.

- Start from the pilot's live results: the SME reviews of 200 accepted records per payment rail per month that were agreed and required by the December 2025 PA, for the period the VectorDB version was in production use. Provide those results with the submission.
- Run the LLM version on the same input records and compare the two versions: how many each resolved, how many passed the Automated Acceptance Rules, and how many were correct, each with its denominator. For simplicity, Validation recommends that both versions' outputs for the sample rows be presented on the same spreadsheet, with particular focus on the rows where the outputs differ. Where the initial match was already confident and unique, the two versions return the same entity and only light review is required; where they differ, SME review establishes which is correct.
- The acceptance-procedure pass rate measures how many outputs clear the rules, not how many are right; SME judgment establishes correctness.
- The same review commitment carried forward for the LLM pilot, with the sample drawn from accepted ACH resolutions and the cadence stated, in Section 4 of the form.
- Review criteria and any additional records are for the Model Owner team to define and document; Validation will assess the evidence produced.

## Scope of the Pilot

- Aditi asked whether the model use remains the same as in the December 2025 PA, which covered five payment rails. Bill stated the LLM work is only in the context of ACH (ACH originated, ACH received, and related ACH categories), and that ACH is by far the most significant rail for the customer. Check, Wire, and Corporate Card, which were in the earlier pilot, would not be in this pilot. Bill confirmed in writing after the meeting (09/22/2026) that the legacy stored procedures resolve those three rails today.
- Aditi asked whether the LLM is intended to replace the stored procedures. Bill stated the original VectorDB intent was ACH only and to replace Kensho. The longer-term intent is to replace the legacy stored procedures, which carry technical debt, with the LLM; the team is not at that point yet.
- Bill stated that production today runs on the stored procedures and that Kensho's contract has been cancelled. The prior flow was stored procedures first, unresolved records to Kensho, then the acceptance procedures. Under the December 2025 PA the VectorDB version took Kensho's place in that flow, receiving the prioritized records the stored procedures leave unresolved. Bill confirmed in writing on 09/22/2026 that the VectorDB version is not currently in use and will not be used on any payment rail after 11/30/2026.


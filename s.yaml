- Automated Acceptance Rules: applied to the LLM version's resolutions of the sample, accepting [N] of [N] ([N] percent).
- SME review set: the [N] accepted resolutions, each judged correct or incorrect against the input record, with the S&P Global result as the primary judgment and the D&B result shown alongside.

The SMEs judged [N] of the [N] accepted resolutions correct, a precision of [N] percent ([N] of [N] on ACH Originated and [N] of [N] on ACH Received), which meets the Business Line's expectation of [N] percent precision for accepted outputs [TBD: the expectation stated in the form; 70 percent in the December 2025 approval]. The SMEs also judged the stored-procedure result and the vector-search result before the LLM steps on the same records. On the [N] records where the vector-search result and the LLM-version result differed, the LLM-version result was judged correct in [N] cases and the vector-search result in [N], which is the measure of what the two language-model steps add. The results were produced on code version [TBD: commit or tag] with the configuration stated in the request form.

**Validation Commentary:** Validation reviewed the sample design, reconciled the reported precision to the record-level results, and has no concerns with the reported performance for the pilot use. The sample of [N] accepted resolutions is limited; the results are directionally informative and may not fully capture performance variability across the pilot population, which the monthly SME review of 200 accepted resolutions per rail during the period is designed to measure. The information provided is sufficient to support the requested pilot use.

### Risk Mitigation

The primary risk of the use is unchanged from the December 2025 Provisional Approval: an incorrect resolution reaching the party summary and misinforming a banker's view of a client's counterparties. The model operates on completed transactions and does not affect payment execution. The layered controls assessed in that approval carry over unchanged: the Business Line's consumer filter and the Customer 360 personal-information and card-data scrub upstream, the Model Owner's name-restoration function, and the Automated Acceptance Rules downstream, which accept a resolution only when the model's confidence score and the Business Line's lexical and phonetic checks of the resolved name against the input name are met. The Model Owner states that the acceptance rules are unchanged since the December 2025 pilot.

The LLM version adds the following controls for the period, as stated in the request form.

- Controlled inputs. Neither language model receives free-form input; the workflow constructs every prompt from internal tables, and, per the Model Owner, the consumer filter and the Customer 360 scrub are applied upstream to the ACH data before any record or transaction summary reaches the LLM steps.
- Containment. The name rewrite is used only to retrieve additional candidates, and the inferred industry is used only as one similarity term in re-ranking; neither decides the resolved entity, and the acceptance rules apply to every output.
- Local hosting. Both models run on bank infrastructure, and no data is sent to an external service.
- Monthly SME review. The Business Line reviews 200 accepted resolutions per ACH rail each month (400 in total), drawn from the accepted population, and retains the results for the Initial Validation.
- Change control. The language models and their weights, the embedding model, the prompts, the confidence thresholds, the scoring weights, and the candidate count are fixed for the period. Immaterial prompt changes (typo corrections, wording made clearer, added few-shot examples) are permitted when recorded in the change log before the change and shown by a regression test on a fixed sample to leave performance unchanged, and they are evaluated together at the Initial Validation. Any other change goes through model change management before use. The agreed definition of an immaterial change is recorded in the request form; the change EMA's model change definition field does not yet carry it.
- Volume. Input is limited to 60,000 records per month and accepted output to [N] records per month.

**Status of the December 2025 commitments and recommendations.** The December 2025 approval committed the Model Owner to a monthly SME review of 200 accepted resolutions per payment rail and set milestones for an LLM challenger from 3/1/2026, a toll-gate decision on 8/1/2026, and development documentation by 9/1/2026. The pilot ran from 12/9/2025 to about 3/31/2026 in the Greenplum environment and stopped when the application moved to Azure; per the Model Owner, the monthly reviews were performed informally and their records were lost in the migration, so they are not available [TBD: Model Risk Governance's update of the December 2025 EMA (60213900) with the 3/31/2026 end date]. The challenger and toll-gate milestones were overtaken by the decision to build the LLM version, and the documentation was not delivered. None of the four recommendations of that approval was evidenced: no formal test of the name-restoration scrub or the Automated Acceptance Rules was provided, no tracking of the confidence-score distribution within the accepted population was provided, the code package shared for this review was not synchronized with the running version, and the documentation for the full validation was not delivered. The SME review in the Model Performance section provides indirect evidence that the acceptance rules select correct resolutions on the pilot population. The four recommendations are carried forward for the LLM version in the Conclusion.

**Validation Commentary:** Validation has no concerns with the retained acceptance rules as the primary output control or with the controls added for the LLM version. The industry term's effect on any candidate's score is bounded by the industry weight. A confident but wrong name rewrite can produce a confident wrong candidate, and the acceptance rules and the monthly SME review are the controls that catch it; the SME review in the Model Performance section shows the acceptance rules holding at [N] percent precision on accepted outputs. Three points bear on the monitoring during the period and are taken up in the Conclusion. The monthly review as described records the SME judgment on each accepted resolution but not whether the resolution came through the name-rewrite pass or carried an industry term, so the contribution of the two language-model steps and any drift in how often they fire are not visible from it; in the SME sample, [N] of [N] inputs triggered the rewrite and [N] had sufficient transactions for industry inference. The regression test in the form is defined for embedding-model changes, while the immaterial prompt changes permitted during the period rely on the same kind of test. The confidence-score distribution within the accepted population, which the December 2025 approval asked the Model Owner to track, is the measure of whether the acceptance thresholds drift as the Business Line tunes to the accepted cap, and the industry term changes that distribution. The Model Owner's position that the transaction summaries carry no personal information was not independently tested by Validation; since both models run on bank infrastructure, personal information in a summary would not leave the bank, and the point is noted for the Initial Validation.


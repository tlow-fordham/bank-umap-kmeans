### Executive Summary

Validation grants provisional approval with a time-bound restriction for the pilot production use of the Large Language Model (LLM) version of Model-7158 Entity Name Resolution as a Service (ENRaaS) on the Automated Clearing House (ACH) Originated and ACH Received payment rails from 11/30/2026 to 5/30/2027. The pilot is restricted to 60,000 input records per month selected by the Business Line from the consumer-filtered population, with accepted resolutions used only to update the party summary provided to commercial bankers, and with the language models, prompts, thresholds, and weights fixed for the period.

The December 2025 Provisional Approval assessed the VectorDB version of the model, a retrieve-and-rank design that matches payment-transaction names to S&P Global and Dun & Bradstreet (D&B) entities, and found the design conceptually sound, the reference data reliable, and the accepted outputs 85.4 percent precise (70 correct of 82 accepted matches) on a Subject Matter Expert (SME) review. That assessment is incorporated by reference and is not repeated here. This review is scoped to what the LLM version changes: two locally hosted language models added to the existing framework, the restriction of use to the two ACH rails, and a pilot population drawn from both sides of the stored procedures.

The provisional approval is based on Validation's preliminary assessment of the conceptual soundness, development, performance, and risk mitigation of the LLM components. Validation reviewed the request form, the change Estimation Method Assessment (EMA), the Model Developer's written description of the resolution flow, and the code, and engaged in weekly sessions with the Model Owner, Business Line, Model Developer, Model Risk Officer, Model Risk Governance, and Fair and Responsible Banking to understand the change.

Performance testing was conducted by the Business Line's SMEs on a sample of [N] names drawn from data set 9, stratified by ACH rail and by stored-procedure outcome, with the stored-procedure, vector-search, and LLM-version results compared. Of the [N] resolutions the Automated Acceptance Rules accepted, the SMEs judged [N] correct, a precision of [N] percent, which meets the Business Line's expectation of [N] percent precision for accepted outputs [TBD: the expectation stated in the form; the December 2025 approval used 70 percent]. Where the vector-search result and the LLM-version result differed, the SMEs judged the LLM-version result correct in [N] of [N] cases. [TBD: one sentence on the sample size limitation if the accepted sample is small.]

Risk is mitigated through the controls of the December 2025 approval, which carry over unchanged (the upstream consumer filter and Customer 360 scrub, the name-restoration function, and the Automated Acceptance Rules as the output control), and through the controls added for the LLM version: no free-form input to either language model, the name rewrite used only to retrieve candidates, the inferred industry used only as one similarity term, local hosting on bank infrastructure, a freeze on the LLM components outside the defined immaterial prompt changes, and a monthly SME review of 200 accepted resolutions per ACH rail. Validation raised observations during the review on the documentation of the LLM components and on two defects in the industry-similarity calculation, and the Model Developer addressed them in the form and in the code version producing the SME results. The acceptable performance and the risk mitigation support the Approved with Restriction outcome. The monitoring commitment and the four recommendations of the December 2025 approval were not evidenced before the VectorDB version was paused, and they are carried forward for the LLM version together with Validation's recommendations on the LLM components in the Conclusion.

### Model Purpose and Usage

The purpose of Model-7158 Entity Name Resolution as a Service, its owner, its reference data, and the tiered resolution funnel it sits at the end of are unchanged from the December 2025 Provisional Approval and are described there. In summary, the Enterprise Analytics and Customer Experience Money Movement Analytics team resolves business names from completed payment transactions to S&P Global and D&B identifiers, the stored procedures resolve the exact matches first, and the model's accepted outputs update the database behind the party summary used by commercial bankers. The model operates on post-processed transaction data and does not influence payment execution.

The LLM version changes the use in three respects. The VectorDB version was approved for five payment rails, whereas the LLM version is requested for ACH Originated and ACH Received only, with the stored procedures continuing to resolve Check, Wire, and Corporate Card. The pilot population also changes: of about 2.2 million ACH records a month, consumer transactions are removed by the Business Line's filter, and from the remaining commercial records the Business Line selects up to 60,000 records per month, described in the form as the most business-critical subset, to run through the LLM version, including records the stored procedures resolve and records they do not, where the December 2025 pilot ran only on the stored procedures' residual. The 60,000 figure, which in the December 2025 approval capped accepted outputs, now caps the records run through the model; accepted output is capped separately at [N] records per month. The stored procedures continue to run as usual, and the Business Line compares the two results over the period to decide whether the LLM version replaces the stored procedures on the ACH rails; the request form sets the toll-gate decision at [TBD: date from the form's milestone list] and states the decision criterion as [TBD: the criterion as stated in the form; the change EMA's pilot decision field cites a matched rate on ACH Received without its base or the comparison it rests on]. Finally, the VectorDB version is no longer in use: the December 2025 pilot ran from 12/9/2025 to about 3/31/2026 in the Greenplum environment and stopped when the application moved to Azure, and the approval expires 11/30/2026 without renewal and without an Initial Validation.

Accepted resolutions are used only to update the party summary, a research view of a client's payment counterparties and outside banking relationships that informs what a commercial banker might offer; no other downstream use is in scope for the period.

**Validation Commentary:** Validation has no concerns with the purpose and the use proposed for the period. The pilot population and the downstream use define what this approval covers, and they are stated consistently in the request form and the change EMA. The toll-gate criterion is the Business Line's decision rule rather than a condition of this approval; Validation notes in the Conclusion that it is to be stated with its base before the toll-gate date.

### Development Data

The reference library (S&P Global and D&B records in the Entity Database, with the entity name embedded by bge-small-en-v1.5 in the Vector Database) and the original query development data are unchanged from the December 2025 Provisional Approval. The reference tables now hold about 92.3 million D&B and 40.5 million S&P Global records, refreshed on demand about three to four times a year; the build in use for the pilot is [TBD: the build after the S&P Global update in the vector database, from the configuration table]. Two data elements are new with the LLM version.

**S&P Global NAICS enrichment.** Some S&P Global reference entities carry no North American Industry Classification System (NAICS) code, which the industry-similarity term needs. The Model Developer fills the gap in three steps: a D-U-N-S cross-reference to the D&B code where one exists, a mapping from the entity's S&P Global industry attributes where the mapping is unambiguous, and, for the remainder, GPT-OSS-20B inferring the single most likely three-digit code from the entity name and S&P Global industry fields. About 3.4 million entities, about 8 percent of the S&P Global reference population, received an LLM-inferred code in the current build. The Model Owner states that the inferred labels were not separately assessed for accuracy and are used as one similarity signal within the confidence score.

**Transaction data for industry inference.** For each input entity with at least ten ACH transactions in the observation window of [TBD: window length, from the configuration table], the runtime aggregates the counterparty names, counterparty types, bank names, and payment descriptions into an evidence summary that is sent to GPT-OSS-20B. Entities below the ten-transaction floor receive no industry term. The Model Owner's position is that ACH transaction data carries no personal information and that the summaries contain business names and transaction usage only; the request form states this as a model assumption, and the consumer filter and Customer 360 scrub run before any record reaches the LLM steps.

**Evaluation data.** The SME review sample is drawn from data set 9, a set of [N] records built by the Business Line from the pilot population after the S&P Global data in the vector database was brought into line with the entity database, stratified by ACH rail and by stored-procedure outcome. An earlier comparison workbook of agreement rates with the stored procedures and of acceptance-rule pass rates on May and June 2026 load days was superseded by data set 9 and is not relied on in this review.

**Validation Commentary:** Validation identified the offline labelling of S&P Global entities during the code review, which the submission had not described, and raised it with the Model Developer, who documented it in the form with the stated limitation. Validation has no concerns with the reference data, as assessed in the December 2025 approval, or with data set 9 as the base for the SME review, since it is drawn from the population the pilot runs on. The accuracy of the inferred NAICS labels is noted for the Initial Validation in the Conclusion.

### Model Theory and Construction

The two-stage retrieve-and-rank framework (vector search on the input name, a weighted similarity score over name, geographic, and contact measures, uniqueness-based rescaling by the gap between the top two candidates, and the ambiguity adjustment of multiple high scores to below 0.9) and the bge-small-en-v1.5 embedding model are unchanged from the December 2025 Provisional Approval, which found the framework conceptually sound and assessed the embedding model. The LLM version adds two locally hosted language models to that framework. Neither is fine-tuned on bank data, neither calls tools or external services, and both run on the bank's NVIDIA DGX infrastructure.

#### Foundation Large Language Models

GPT-OSS-20B (model ID gpt-oss-20b) is an open-weight mixture-of-experts model released by OpenAI, with about 21 billion parameters, about 3.6 billion active per token, and a 131,072-token context window. It is used at runtime to infer a two-digit NAICS sector for the input entity from its aggregated ACH transaction summary, and offline to assign three-digit NAICS codes to the S&P Global reference entities that lack one. The pilot configuration sets the temperature at 0.01 and the reasoning effort at [TBD], with text input and output only [TBD: confirm against the configuration table].

Mistral-7B-Instruct-v0.3 (model ID [TBD: Mistral-7B-Instruct-v0.3 or the quantized copy named in the configuration table]) is an open-weight instruction-tuned model released by Mistral AI, with about 7 billion parameters and a 32,768-token context window. It is used at runtime to rewrite an abbreviated, truncated, or ambiguous input name into a likely official business name for a second retrieval pass. The pilot configuration sets the temperature at 0.75, top-p at 0.95, and the maximum output at 256 tokens, with text input and output only.

Published benchmark results are available for both models. Validation did not rely on general benchmarks for this review, since neither model's task here (sector classification from a transaction summary, and name normalization) is measured by them; the evidence of performance is the SME review in the Model Performance section.

#### Model workflow

An input business name proceeds through the following stages.

1. Candidate retrieval. The vector search on the input name returns at least 20 candidate entities [TBD: the candidate count from the configuration table] from the reference library, as in the VectorDB version.
2. Name rewrite and second retrieval pass (Mistral-7B-Instruct-v0.3). Where the best candidate's initial confidence score is below 0.8, the model is prompted with the input name to return a likely official business name, and the vector search is repeated on the rewritten name. Candidates from the second pass are scored like any other.
3. Industry inference (GPT-OSS-20B). Where the input entity has at least ten ACH transactions in the observation window, the model classifies it into one of the twenty two-digit NAICS sectors from the evidence summary described in the Development Data section. Entities without sufficient transactions receive no industry term.
4. Confidence scoring and re-ranking. Each candidate receives the raw similarity score of the VectorDB version, blended with the cosine similarity between the inferred sector and the candidate's NAICS code in a learned projection of NAICS descriptions, at a fixed industry weight of [TBD]. Uniqueness-based rescaling and the ambiguity adjustment then apply as before.
5. Resolution output. The highest-scoring S&P Global candidate and the highest-scoring D&B candidate are returned with their confidence scores; the two reference sets are matched independently, and the S&P Global identifier is the primary output. The model always returns an output, and the Business Line's Automated Acceptance Rules decide whether a resolution is accepted.

#### Prompts

The three prompts are reproduced in the appendix of the request form. The name-rewrite prompt instructs Mistral-7B-Instruct-v0.3 to normalize the input name and infer the most likely official business name from its learned knowledge only, without reference to external sources, and to return one JavaScript Object Notation (JSON) object with the name, an address, a description, and a confidence value. The runtime industry prompt instructs GPT-OSS-20B to classify the entity into one primary sector from the list of twenty using only the evidence summary, returning strict JSON with the primary sector, three ranked sectors with probabilities, a confidence value, and rationale terms. The offline labelling prompt instructs GPT-OSS-20B to infer a valid three-digit code for each reference entity in a batch from its name and S&P Global industry fields, choosing the closest reasonable code when uncertain. A response that is not valid JSON is discarded by the parser and not used, and the confidence values returned by both models are not used in the score.

Prompt and response together use a small share of each model's context window: about 440 tokens of 32,768 for the name rewrite, about 1,960 of 131,072 for an industry inference, and about 6,900 of 131,072 for a labelling batch of 60 reference entities, as measured on the code package [TBD: confirm the prompt templates, the batch size, and the evidence caps against the running version]. Each call is a single-turn prompt with no conversation history.

#### Guardrails

The model has no conversational interface and accepts no free-form user input, so the guardrails are structural. Inputs to both language models are constructed programmatically by the workflow from internal tables. The name rewrite is used only to retrieve additional candidates and does not select the resolved entity; the inferred industry is used only as one similarity term in re-ranking. Responses are parsed as JSON and discarded when invalid. Both models run on bank-hosted infrastructure with no external service, so no data leaves the bank. The Automated Acceptance Rules downstream, described in the Risk Mitigation section, remain the control on what is used.

**Validation Commentary:** Validation reviewed the code package for the foundation, runtime, and common modules, the Model Developer's written description of the flow, and the three prompts. The two language-model steps are constrained to adding candidates and one similarity term rather than deciding the match, which preserves the controls the December 2025 approval relied on, and Validation has no concerns with the design for the use proposed for the period.

Validation raised observations during the review on the documentation of the offline labelling step, on two defects in the industry-similarity calculation (an inference that returned no valid sector was recorded as Agriculture with probability 1.0, and candidates in the Manufacturing, Retail, and Transportation sectors received an industry similarity of zero because their two-digit codes were not keyed to the combined sector ranges), on an unused business-size inference in the package, and on the reference-data version in the configuration files. The Model Developer acknowledged the two defects, corrected the fallback to record such cases as unknown, mapped the individual codes to the combined sectors in data preparation, and corrected the documentation on the other points. The SME results in the Model Performance section were produced on the corrected version [TBD: commit or tag from the configuration table]. Validation also noted that the name-rewrite prompt in the form's appendix differs from the code package reviewed, in that the search step now instructs the model to use learned knowledge only and the request for the top three matches is removed; the form states this as the running prompt and the date of the change [TBD: confirm].

Three design points are noted for the Initial Validation rather than for this approval. The industry weight was selected empirically on the evaluation data the results are reported on, and the basis for the 0.8 rewrite trigger and the acceptance tiers is not documented; for ACH inputs, which carry no phone or address, the attainable score range is narrower than for other rails, so the trigger and the tiers sit close to its ceiling. The contribution of the learned industry projection over a direct comparison of sector codes has not been measured. The Model Developer keeps several score variants in the code and names enraas_score_2 as the one the acceptance rules read; the variant in use is fixed by the configuration table [TBD]. The mismatch between the shared code package and the running version, the stale reference-data version in the configuration files, and the prompt change described above are the reasons the December 2025 versioning recommendation is carried forward in the Conclusion.


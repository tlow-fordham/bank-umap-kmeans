## PA Request Form Format

- The MRO explained that the MO team placed its responses beside the list of requirements at the end of the form so the questions and answers could be tracked together, and asked whether the form could be accepted in that layout.
- MRG stated that the submitted form should be complete within the form boxes, without comments and without a separate list of Validation's questions and the MO's responses.
- Validation agreed that the responses belong in the form boxes. Validation noted that the list of requirements was provided to cover the GenAI items that the current form does not ask for.
- The MO will move the responses into the relevant boxes as complete answers and remove the list and the comments. The MO noted that the update will follow other priority work currently underway.
- The MO asked whether the answers need changes beyond being placed in the boxes. Validation asked for the pilot dates to be corrected.

## Pilot Dates and EMA

- Previous pilot period: 02/18/2027 through 08/16/2027. Revised pilot period in the form: 03/01/2027 through 09/01/2027, tentative.
- The MO stated that the business line is not yet certain of the pilot start date and that 03/01/2027 is the current expectation. The date may move as the work progresses, and the business line is aiming for the first quarter of 2027, most likely March.
- Question 2 of the form still shows a Phase 1 date of 11/19/2026. The MO will correct it.
- MRG noted that the EMA shows an expected date of first use of 02/18/2027 and is with the MO in Archer for update. The MO will update the EMA with the expected pilot dates.

## Prompts, Diagrams, and Repository Access

- Validation asked Platform for access to the Git repository with the prompts, and for the monitored metrics and alarm thresholds. Platform stated that the prompts are still being developed and will be shared once they are ready. No date was given.
- Validation noted that the architecture diagram and the guardrail document have not yet been received. Platform stated that one diagram is ready and will be shared first, and that a high-level architecture diagram is still being prepared.
- Validation asked Platform to share material as each piece becomes available, so the review can begin before the full set is complete.

## Language Model and Speech Engine Versions

- Platform stated that it is exploring a newer Claude Sonnet model (version 5 or 5.2) as the reasoning model, in place of the Claude Haiku 4.5 named in the form. Platform's position is that Sonnet performs better than Haiku for reasoning across the business lines' knowledge bases and that the newer version performs better than version 4.5. The model has not yet been enabled within the bank.
- Platform stated that the speech-to-speech model will be Nova Sonic 2.5, where the form names Nova Sonic 2.0, and that the request to use it in the lower environments is close to approval.
- The MO stated that the team will proceed with the model that is ready and will update the form once Platform provides the details.
- MRG asked whether the model version would change if a newer version is released before or during the pilot. Platform stated that once the versions are named in the PA request form, there is no plan to move to a newer version during the pilot.
- Validation's understanding is that the choice between Nova Sonic and Deepgram with Cartesia for the pilot is still open.
- The model names and versions above are the best information the MO and Platform could provide at the time of the meeting. The exact versions will be stated in the form once Platform sends the details to the MO.


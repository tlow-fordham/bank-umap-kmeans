**Edit 5. Insert the section "Data for the experiments" between the Tools and platforms section and the Deliverables and delivery form section.** Use the same heading style as the other section headings and the same bullet style as the other sections. Text, verbatim:

Data for the experiments

- Agent built by Validation. The control offset experiment switches controls on and off, which cannot be done on a production model, so it runs on a LangGraph agent the team builds on the gateway in the development environment. Its task set is synthetic banking work (dispute intake, balance transfer, address change) with a written policy, an expected tool sequence and an expected final state per task, generated with the toolkit's synthetic data generator and Claude Code and reviewed by the team. No customer data.
- Existing-model traces. The evaluator-sensitivity experiment and the trajectory rubric use real traces: Model-7409 trace files in JSON, requested from the model owner as the validation template provides (pilot volume is small, 10 claims through 3,657 interactions, so these are a calibration sample rather than a test set); the Validation-authored Crescendo transcripts from the Model-7569 and Model-7631 PAs, which contain no customer data; and traces from the first pipeline kickoff. Real traces enter the sandbox only within the permitted data boundary, with customer PII masked or excluded; that boundary is confirmed before any trace is moved.
- Public sets. AgentDojo for tool-use tasks with injected content, and the TRAIL annotated traces (MIT licence) for judge calibration. MAST and AgentErrorBench carry non-commercial licences and serve as annotation schemas only. The banking domain of the tau2-bench repository and FraudBench, both MIT-licensed synthetic retail-banking task sets released in 2026, can seed or cross-check the team's own task set. Results are pinned to a version, because tau2-bench 2.0.0 scores are not comparable with 1.x.
- Labels. Human labels on a sample of traces by the team, with inter-rater agreement recorded, because judge acceptance thresholds are set against human agreement rather than against perfect agreement.
- Collection path. Existing traces through the model owner request at kickoff and the team's own PA testing records in the model folders; synthetic tasks and attack sets stored in the research folder, versioned, so the same set serves the multi-turn guardrails line.

Comment, on the heading: Added in answer to Aditi's comment on experiment data. The two public banking task sets are new since the 10/15 draft; both are MIT, so we can use them.

